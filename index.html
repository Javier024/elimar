<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Iniciar Sesión | PARQUEADERO ELIMAR</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%231e293b' width='100' height='100' rx='20'/><text y='.9em' font-size='80' x='50%' text-anchor='middle' fill='%2334d399' font-family='Arial' font-weight='bold'>P</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        .split-image-panel {
            background-image: url('https://d2yoo3qu6vrk5d.cloudfront.net/pulzo-lite/images-resized/PP4603966-h-o.webp');
            background-size: cover;
            background-position: center; 
            background-repeat: no-repeat;
            position: relative;
        }

        .overlay-dark {
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.6), rgba(15, 23, 42, 0.9));
        }

        .hidden-tab { display: none; animation: fadeIn 0.4s ease-in-out; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .custom-input:focus { border-color: #0f172a; box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.1); }
    </style>
</head>
<body class="bg-white min-h-screen w-full flex flex-col md:flex-row">

    <!-- LADO IZQUIERDO: IMAGEN -->
    <div class="w-full h-56 md:h-full md:w-1/2 split-image-panel relative flex flex-col justify-end p-6 md:p-12 shrink-0">
        <div class="absolute inset-0 overlay-dark z-0"></div>
        <div class="relative z-10 text-white">
            <div class="flex items-center gap-3 mb-3">
                <div class="w-12 h-12 bg-emerald-500 rounded-lg flex items-center justify-center shadow-lg shadow-emerald-500/40">
                    <i class="fa-solid fa-square-parking text-white text-2xl"></i>
                </div>
                <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight leading-tight">Parqueadero<br><span class="text-emerald-400 font-light">ELIMAR</span></h1>
            </div>
            <p class="text-slate-300 text-sm md:text-base max-w-md leading-relaxed hidden md:block">
                Sistema de gestión vehicular moderno y seguro.
            </p>
        </div>
    </div>

    <!-- LADO DERECHO: FORMULARIO -->
    <div class="w-full md:w-1/2 flex-1 bg-white flex flex-col items-center justify-center p-6 md:p-12 relative overflow-y-auto">
        <div class="w-full max-w-md py-4">
            
            <!-- Tabs -->
            <div class="flex gap-8 mb-8 border-b border-slate-100">
                <button onclick="showTab('login-section')" id="tab-login" class="pb-3 text-sm font-bold text-slate-900 border-b-2 border-slate-900 transition-colors">
                    Iniciar Sesión
                </button>
                <button onclick="showTab('recover-section')" id="tab-recover" class="pb-3 text-sm font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-600 transition-colors">
                    Recuperar
                </button>
            </div>

            <!-- SECCIÓN LOGIN -->
            <div id="login-section" class="auth-content">
                <h2 class="text-2xl font-bold text-slate-900 mb-2">Bienvenido</h2>
                <p class="text-slate-500 text-sm mb-8">Ingresa tus credenciales.</p>

                <form onsubmit="handleLogin(event)" class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">Usuario</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa-regular fa-user text-slate-400 group-focus-within:text-slate-900 transition-colors"></i>
                            </div>
                            <input type="text" id="loginUser" class="custom-input block w-full pl-10 pr-3 py-3 border border-slate-200 rounded-lg text-sm bg-slate-50 focus:bg-white outline-none" placeholder="Usuario" required>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">Contraseña</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa-solid fa-lock text-slate-400 group-focus-within:text-slate-900 transition-colors"></i>
                            </div>
                            <input type="password" id="loginPass" class="custom-input block w-full pl-10 pr-3 py-3 border border-slate-200 rounded-lg text-sm bg-slate-50 focus:bg-white outline-none" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="flex items-center justify-end">
                        <a href="#" onclick="showTab('recover-section')" class="text-xs font-semibold text-emerald-600 hover:text-emerald-700 transition-colors">¿Olvidaste tu clave?</a>
                    </div>

                    <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-lg shadow-lg shadow-slate-900/20 transition-all active:scale-95 flex items-center justify-center gap-2 mt-2">
                        <span>Ingresar</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </form>
            </div>

            <!-- SECCIÓN RECUPERAR -->
            <div id="recover-section" class="auth-content hidden-tab">
                <h2 class="text-2xl font-bold text-slate-900 mb-2">Restablecer Acceso</h2>
                <p class="text-slate-500 text-sm mb-6">Te enviaremos una contraseña temporal a tu correo.</p>

                <div class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-2">Tu Usuario</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa-solid fa-user text-slate-400"></i>
                            </div>
                            <input type="text" id="recoverUser" class="custom-input block w-full pl-10 pr-3 py-3 border border-slate-200 rounded-lg text-sm bg-slate-50 focus:bg-white outline-none" placeholder="Ingresa tu usuario">
                        </div>
                    </div>

                    <!-- Botón Email Único -->
                    <button onclick="handleRecoverMethod('email')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-lg shadow-md transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-envelope"></i>
                        <span>Enviar Contraseña por Correo</span>
                    </button>

                    <div class="text-center mt-4">
                        <a href="#" onclick="showTab('login-section')" class="text-sm font-medium text-slate-500 hover:text-slate-900 flex items-center justify-center gap-2 transition-colors">
                            <i class="fa-solid fa-arrow-left text-xs"></i> Volver al Login
                        </a>
                    </div>
                </div>
            </div>
            
            <div class="mt-10 text-center">
                <p class="text-xs text-slate-400">© 2023 PARQUEADERO ELIMAR</p>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
