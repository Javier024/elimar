<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial | ParkingSys</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .custom-input { background: #fff; border: 1px solid #cbd5e1; color: #334155; transition: all 0.2s; padding: 8px 12px; border-radius: 8px; width: 100%; }
        .custom-input:focus { border-color: #6366f1; outline: 0; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); }
        ::-webkit-scrollbar { width: 6px; height: 6px; } ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 20px; }
        @media (max-width: 1024px) {
            table, thead, tbody, th, td, tr { display: block; }
            thead tr { position: absolute; top: -9999px; left: -9999px; }
            tr { background: white; border: 1px solid #e2e8f0; margin-bottom: 16px; border-radius: 12px; padding: 16px; }
            td { border: none; position: relative; padding: 8px 0; display: flex; justify-content: space-between; align-items: center; text-align: right; border-bottom: 1px dashed #f1f5f9; }
            td:last-child { border-bottom: none; }
            td:before { content: attr(data-label); font-weight: 600; color: #64748b; text-align: left; margin-right: 12px; font-size: 13px; }
        }
    </style>
</head>
<body class="text-slate-700 antialiased flex h-screen overflow-hidden">

    <!-- MOBILE MENU OVERLAY -->
    <div id="mobileMenuOverlay" onclick="toggleMenu()" class="fixed inset-0 bg-slate-900/50 z-30 hidden lg:hidden backdrop-blur-sm"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-white border-r border-slate-200 transform -translate-x-full lg:translate-x-0 lg:static lg:inset-auto transition-transform duration-300">
        <div class="h-16 flex items-center px-6 border-b border-slate-100">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center mr-3 shadow-lg shadow-indigo-200"><i class="fa-solid fa-square-parking text-white text-sm"></i></div>
            <h1 class="text-lg font-bold text-slate-800">Parking<span class="text-indigo-600">Sys</span></h1>
        </div>
        <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
            <a href="../dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 nav-item"><i class="fa-solid fa-chart-pie w-5"></i> Dashboard</a>
            <a href="clientes.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 nav-item"><i class="fa-solid fa-users w-5"></i> Clientes</a>
            <a href="puestos.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 nav-item"><i class="fa-solid fa-layer-group w-5"></i> Puestos</a>
            <a href="caja.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 nav-item"><i class="fa-solid fa-cash-register w-5"></i> Caja</a>
            <a href="gastos.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 nav-item"><i class="fa-solid fa-receipt w-5"></i> Gastos</a>
            
            <!-- HISTORIAL ACTIVO -->
            <a href="historial.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium bg-indigo-50 text-indigo-700 shadow-sm ring-1 ring-indigo-100 nav-item"><i class="fa-solid fa-clock-rotate-left w-5"></i> Historial</a>
            
            <a href="configuracion.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 nav-item"><i class="fa-solid fa-gear w-5"></i> Configuración</a>
        </nav>
        <div class="p-4 border-t border-slate-100"><button onclick="cerrarSesion()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold text-red-600 hover:bg-red-50 border border-red-100 transition-colors"><i class="fa-solid fa-power-off"></i> Cerrar Sesión</button></div>
    </aside>

    <!-- MAIN CONTENT WRAPPER -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative w-full">
        <header class="h-16 bg-white/90 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-4 lg:px-8 sticky top-0 z-20">
            <div class="flex items-center gap-4">
                <button onclick="toggleMenu()" class="lg:hidden p-2 text-slate-600 hover:bg-slate-100 rounded-lg"><i class="fa-solid fa-bars text-xl"></i></button>
                <h2 class="text-lg lg:text-xl font-bold text-slate-800">Historial de Movimientos</h2>
            </div>
            <span id="fecha-actual" class="text-xs lg:text-sm font-medium text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200"></span>
        </header>

        <div class="flex-1 overflow-y-auto p-4 lg:p-8">
            <!-- KPIs -->
            <div class="grid grid-cols-2 lg:grid-cols-3 gap-4 mb-8">
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div><span class="text-xs font-bold text-slate-400 uppercase block">Total Registros</span><span class="text-2xl font-bold text-slate-800 block mt-1">124</span></div>
                    <i class="fa-solid fa-list-ol text-slate-200 text-2xl"></i>
                </div>
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between border-l-4 border-l-emerald-500">
                    <div><span class="text-xs font-bold text-slate-400 uppercase block">Recaudado</span><span class="text-xl font-bold text-emerald-600 font-mono block mt-1">$4,500</span></div>
                    <i class="fa-solid fa-money-bill-trend-up text-emerald-100 text-2xl"></i>
                </div>
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between border-l-4 border-l-amber-500">
                    <div><span class="text-xs font-bold text-slate-400 uppercase block">En Parqueo</span><span class="text-2xl font-bold text-amber-600 block mt-1">5</span></div>
                    <i class="fa-solid fa-car text-amber-100 text-2xl"></i>
                </div>
            </div>

            <!-- FILTROS -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6 flex flex-col xl:flex-row gap-4 items-center justify-between">
                <div class="flex flex-wrap gap-3 items-center w-full xl:w-auto">
                    <input type="date" class="custom-input text-sm w-32">
                    <input type="date" class="custom-input text-sm w-32">
                    <div class="relative"><i class="fa-solid fa-search absolute left-3 top-2.5 text-slate-400 text-xs"></i><input type="text" placeholder="Placa..." class="custom-input pl-8 text-sm w-32 xl:w-48"></div>
                    <select class="custom-input text-sm w-32 xl:w-40 cursor-pointer"><option value="all">Todo</option><option>Carro</option><option>Moto</option></select>
                </div>
                <div class="flex items-center gap-2 w-full xl:w-auto">
                    <button class="flex-1 xl:flex-none bg-slate-700 hover:bg-slate-800 text-white px-3 py-2 rounded-lg text-xs font-bold transition flex items-center justify-center gap-2"><i class="fa-solid fa-plus"></i> Manual</button>
                    <button onclick="downloadReport()" class="flex-1 xl:flex-none bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg text-xs font-bold transition flex items-center justify-center gap-2"><i class="fa-solid fa-download"></i> CSV</button>
                </div>
            </div>

            <!-- TABLA -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col min-h-[500px]">
                <div class="overflow-x-auto flex-1">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-50 text-slate-500 text-xs uppercase sticky top-0 hidden lg:table-header-group">
                            <tr><th class="px-6 py-3 font-semibold">Fecha</th><th class="px-6 py-3 font-semibold">Entrada</th><th class="px-6 py-3 font-semibold">Salida</th><th class="px-6 py-3 font-semibold">Placa</th><th class="px-6 py-3 font-semibold">Tipo</th><th class="px-6 py-3 font-semibold">Duración</th></tr>
                        </thead>
                        <tbody class="text-sm text-slate-700 divide-y divide-slate-100">
                            <!-- DUMMY ROWS -->
                            <tr>
                                <td class="px-6 py-4" data-label="Fecha">24 Oct 2023</td>
                                <td class="px-6 py-4" data-label="Entrada">08:00 AM</td>
                                <td class="px-6 py-4" data-label="Salida">10:30 AM</td>
                                <td class="px-6 py-4 font-mono font-bold" data-label="Placa">ABC-123</td>
                                <td class="px-6 py-4" data-label="Tipo">Carro</td>
                                <td class="px-6 py-4" data-label="Duración">2h 30m</td>
                            </tr>
                             <tr>
                                <td class="px-6 py-4" data-label="Fecha">24 Oct 2023</td>
                                <td class="px-6 py-4" data-label="Entrada">09:15 AM</td>
                                <td class="px-6 py-4" data-label="Salida">--:--</td>
                                <td class="px-6 py-4 font-mono font-bold text-amber-600" data-label="Placa">XYZ-987</td>
                                <td class="px-6 py-4" data-label="Tipo">Moto</td>
                                <td class="px-6 py-4" data-label="Duración">En curso</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('fecha-actual').innerText = new Date().toLocaleDateString('es-ES');
        function toggleMenu() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('mobileMenuOverlay').classList.toggle('hidden'); }
        function cerrarSesion() { if(confirm('Salir?')) window.location.href='../index.html'; }
        function downloadReport() { alert('Descargando reporte CSV...'); }
    </script>
</body>
</html>
