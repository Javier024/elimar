<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial - Parqueadero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        .elegant-input { background: #ffffff; border: 1px solid #cbd5e1; color: #334155; transition: all 0.3s ease; }
        .elegant-input:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .page-btn { transition: all 0.2s; }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body class="text-slate-700 antialiased flex h-screen overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col shadow-[4px_0_24px_rgba(0,0,0,0.02)] z-20">
        <div class="h-16 flex items-center px-8 border-b border-slate-100">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-square-parking text-sm"></i>
                </div>
                <h1 class="text-xl font-bold text-slate-800 tracking-tight">PARKING<span class="text-blue-600">SYS</span></h1>
            </div>
        </div>
        <nav class="flex-1 overflow-y-auto py-6 px-4 space-y-1">
            <p class="px-4 text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Menú</p>
            <a href="../dashboard.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-xl font-medium transition-colors group"><i class="fa-solid fa-chart-line w-5 text-slate-400 group-hover:text-blue-500"></i> <span>Dashboard</span></a>
            <a href="clientes.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-xl font-medium transition-colors group"><i class="fa-solid fa-users w-5 text-slate-400 group-hover:text-blue-500"></i> <span>Clientes</span></a>
            <a href="puestos.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-xl font-medium transition-colors group"><i class="fa-solid fa-layer-group w-5 text-slate-400 group-hover:text-blue-500"></i> <span>Puestos</span></a>
            <a href="caja.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-xl font-medium transition-colors group"><i class="fa-solid fa-cash-register w-5 text-slate-400 group-hover:text-blue-500"></i> <span>Caja</span></a>
            <a href="gastos.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-xl font-medium transition-colors group"><i class="fa-solid fa-receipt w-5 text-slate-400 group-hover:text-blue-500"></i> <span>Gastos</span></a>
            
            <!-- ACTIVO -->
            <a href="historial.html" class="flex items-center gap-3 px-4 py-3 bg-blue-50 text-blue-600 rounded-xl font-medium transition-colors group"><i class="fa-solid fa-clock-rotate-left w-5"></i> <span>Historial</span></a>
            
            <a href="configuracion.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-xl font-medium transition-colors group"><i class="fa-solid fa-gear w-5 text-slate-400 group-hover:text-blue-500"></i> <span>Configuración</span></a>
        </nav>
        <div class="p-4 border-t border-slate-100">
            <div class="flex items-center gap-3 p-2 rounded-xl hover:bg-slate-50 transition cursor-pointer">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-yellow-600 to-yellow-400 border-2 border-white shadow-sm"></div>
                <div><p class="text-sm font-semibold text-slate-800">Admin</p><p class="text-xs text-emerald-500">En línea</p></div>
            </div>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header class="h-16 bg-white/80 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-8 z-30 sticky top-0">
            <h2 class="text-xl font-bold text-slate-800">Historial de Movimientos</h2>
            <div class="flex items-center gap-3">
                <span class="text-sm font-medium text-slate-500 bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm" id="fecha-actual"></span>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
            
            <!-- KPI CARDS -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl border border-slate-100 shadow-sm flex flex-col">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Visitas</span>
                    <span class="text-3xl font-bold text-slate-800 mt-1" id="kpiVisits">0</span>
                </div>
                <div class="bg-white p-6 rounded-xl border border-slate-100 shadow-sm flex flex-col border-l-4 border-l-emerald-500">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Recaudado</span>
                    <span class="text-2xl font-bold text-emerald-600 mt-1 font-mono" id="kpiRevenue">$0.00</span>
                </div>
                <div class="bg-white p-6 rounded-xl border border-slate-100 shadow-sm flex flex-col">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Promedio Estadía</span>
                    <span class="text-3xl font-bold text-slate-800 mt-1" id="kpiAvgTime">0h</span>
                </div>
                <div class="bg-white p-6 rounded-xl border border-slate-100 shadow-sm flex flex-col border-l-4 border-l-red-500">
                    <span class="text-xs font-bold text-red-500 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-file-invoice-dollar"></i> Pendientes
                    </span>
                    <span class="text-3xl font-bold text-red-600 mt-1" id="kpiPending">0</span>
                </div>
            </div>

            <!-- BARRA DE FILTROS -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6 flex flex-wrap gap-4 items-center">
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-slate-500">Desde:</span>
                    <input type="date" id="filterDateStart" class="elegant-input px-3 py-1.5 rounded text-sm">
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-slate-500">Hasta:</span>
                    <input type="date" id="filterDateEnd" class="elegant-input px-3 py-1.5 rounded text-sm">
                </div>
                <div class="h-8 w-px bg-slate-200 mx-2 hidden md:block"></div>
                <div class="relative flex-1 max-w-xs">
                    <input type="text" id="filterPlate" placeholder="Buscar por Placa..." class="elegant-input pl-9 pr-4 py-1.5 rounded-full text-sm focus:ring-blue-500">
                    <i class="fa-solid fa-search absolute left-3 top-2 text-gray-400 text-xs"></i>
                </div>
                <button onclick="applyFilters()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-lg text-sm font-semibold transition flex items-center gap-2 shadow-md">
                    <i class="fa-solid fa-filter"></i> Filtrar
                </button>
            </div>

            <!-- TABLA HISTORIAL -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden h-full flex flex-col">
                <div class="overflow-x-auto flex-1">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-50 text-slate-500 text-xs uppercase sticky top-0 z-10">
                            <tr>
                                <th class="px-6 py-3 font-semibold">Fecha</th>
                                <th class="px-6 py-3 font-semibold">Entrada</th>
                                <th class="px-6 py-3 font-semibold">Salida</th>
                                <th class="px-6 py-3 font-semibold">Placa</th>
                                <th class="px-6 py-3 font-semibold">Vehículo</th>
                                <th class="px-6 py-3 font-semibold">Duración</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody" class="text-sm text-slate-700 divide-y divide-slate-100">
                            <!-- JS Render -->
                        </tbody>
                    </table>
                </div>

                <!-- Paginación -->
                <div class="bg-slate-50 px-6 py-4 border-t border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4">
                    <span class="text-xs text-slate-500" id="paginationInfo">Mostrando 0 a 0 de 0 registros</span>
                    <div class="flex items-center gap-1" id="paginationControls"></div>
                </div>
            </div>

        </div>
    </main>

    <!-- Enlace al JS externo -->
    <script src="../parqueo/js/historial.js"></script>
</body>
</html>
