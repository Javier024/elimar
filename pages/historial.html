<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial | PARQUEADERO ELIMAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- 1. Script de Seguridad -->
    <script src="../js/auth-manager.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Scrollbar personalizado */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .activity-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .activity-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>

<!-- 
  CAMBIO CLAVE EN BODY:
  flex-col: Móvil.
  lg:flex-row: PC (Menú y contenido paralelos).
  h-screen: Altura completa.
-->
<body class="text-slate-700 antialiased flex flex-col lg:flex-row h-screen overflow-hidden bg-slate-50 w-full">

    <!-- MOBILE MENU OVERLAY -->
    <div id="mobileMenuOverlay" onclick="toggleMenu()" class="fixed inset-0 bg-slate-900/50 z-40 hidden backdrop-blur-sm transition-opacity"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-white border-r border-slate-200 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col lg:static lg:z-auto lg:flex lg:flex-col shadow-xl lg:shadow-none">
        
        <!-- Header Sidebar -->
        <div class="h-16 flex items-center px-6 border-b border-slate-100 shrink-0">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center mr-3 shadow-lg shadow-indigo-200 flex-shrink-0">
                <i class="fa-solid fa-square-parking text-white text-sm"></i>
            </div>
            <div class="min-w-0">
                <h1 class="text-lg font-bold text-slate-800 truncate">ELIMAR<span class="text-indigo-600">Sys</span></h1>
                <p class="text-[10px] text-slate-400 font-medium truncate" id="sidebar-user-name">Sistema</p>
            </div>
        </div>

        <!-- Navegación -->
        <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
            <a href="../dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors nav-item"><i class="fa-solid fa-chart-pie w-5 text-center"></i> Dashboard</a>
            <a href="clientes.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 nav-item"><i class="fa-solid fa-users w-5 text-center"></i> Clientes</a>
            <a href="puestos.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 nav-item"><i class="fa-solid fa-layer-group w-5 text-center"></i> Puestos</a>
            <a href="caja.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 nav-item"><i class="fa-solid fa-cash-register w-5 text-center"></i> Caja</a>
            <a href="gastos.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 nav-item"><i class="fa-solid fa-receipt w-5 text-center"></i> Gastos</a>
            
            <!-- Historial Activo -->
            <a href="historial.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium bg-indigo-50 text-indigo-700 shadow-sm ring-1 ring-indigo-100 nav-item"><i class="fa-solid fa-clock-rotate-left w-5 text-center"></i> Historial</a>
            
            <a href="configuracion.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 nav-item"><i class="fa-solid fa-gear w-5 text-center"></i> Configuración</a>
        </nav>

        <!-- Botón Cerrar Sesión -->
        <div class="p-4 border-t border-slate-100 shrink-0">
            <button onclick="logout()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold text-red-600 hover:bg-red-50 border border-red-100 transition-colors">
                <i class="fa-solid fa-power-off"></i> Cerrar Sesión
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden relative w-full bg-slate-50">
        
        <!-- HEADER -->
        <header class="h-16 bg-white/90 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-4 lg:px-8 sticky top-0 z-20 shadow-sm shrink-0">
            <div class="flex items-center gap-4">
                <button onclick="toggleMenu()" class="lg:hidden p-2 text-slate-600 hover:bg-slate-100 rounded-lg">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <div class="flex flex-col">
                    <h2 class="text-lg lg:text-xl font-bold text-slate-800">Historial de Operaciones</h2>
                    <span class="text-xs text-slate-500 font-medium hidden sm:block">Auditoría completa de movimientos</span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <i class="fa-regular fa-calendar text-slate-400"></i>
                <span id="fecha-actual" class="text-sm font-medium text-slate-600 bg-slate-100 px-3 py-1 rounded-full border border-slate-200"></span>
            </div>
        </header>

        <!-- CONTENIDO SCROLLABLE -->
        <div class="flex-1 overflow-y-auto p-4 lg:p-8">
            <div class="max-w-7xl mx-auto space-y-6">
                <!-- Filtros Responsive -->
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col xl:flex-row gap-4 justify-between items-center">
                    <div class="flex flex-wrap items-center gap-3 w-full xl:w-auto">
                        <!-- Inputs de fecha -->
                        <div class="relative group w-full sm:w-auto">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa-regular fa-calendar text-slate-400 text-xs group-focus-within:text-indigo-500 transition-colors"></i>
                            </div>
                            <input type="date" id="filterDateStart" onchange="applyFilters()" class="pl-9 pr-3 py-2.5 w-full sm:w-36 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-shadow bg-slate-50 focus:bg-white">
                        </div>
                        <div class="relative group w-full sm:w-auto">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa-solid fa-calendar-check text-slate-400 text-xs group-focus-within:text-indigo-500 transition-colors"></i>
                            </div>
                            <input type="date" id="filterDateEnd" onchange="applyFilters()" class="pl-9 pr-3 py-2.5 w-full sm:w-36 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-shadow bg-slate-50 focus:bg-white">
                        </div>
                        
                        <!-- Buscador y Filtro -->
                        <div class="flex gap-2 w-full sm:w-auto">
                            <div class="relative flex-1">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-search text-slate-400 text-xs group-focus-within:text-indigo-500 transition-colors"></i>
                                </div>
                                <input type="text" id="filterSearch" onkeyup="applyFilters()" placeholder="Buscar..." class="pl-9 pr-3 py-2.5 w-full border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-shadow bg-slate-50 focus:bg-white">
                            </div>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-filter text-slate-400 text-xs group-focus-within:text-indigo-500 transition-colors"></i>
                                </div>
                                <select id="filterType" onchange="applyFilters()" class="pl-9 pr-8 py-2.5 w-full border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-shadow bg-slate-50 focus:bg-white appearance-none cursor-pointer">
                                    <option value="all">Todas</option>
                                    <option value="Carro">Carros</option>
                                    <option value="Moto">Motos</option>
                                    <option value="Camioneta">Camionetas</option>
                                    <option value="CAJA">Ingresos</option>
                                    <option value="GASTO">Gastos</option>
                                    <option value="CLIENTE">Clientes</option>
                                    <option value="PUESTO">Puestos</option>
                                </select>
                                <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-400">
                                    <i class="fa-solid fa-chevron-down text-xs"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Botón Imprimir -->
                    <div class="w-full xl:w-auto mt-2 xl:mt-0 border-t xl:border-t-0 pt-2 xl:pt-0 border-slate-100">
                        <button onclick="window.print()" class="w-full bg-slate-800 hover:bg-slate-900 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition-all shadow-md hover:shadow-lg flex items-center justify-center gap-2"><i class="fa-solid fa-print"></i> Imprimir Reporte</button>
                    </div>
                </div>

                <!-- Contenedor de Historial -->
                <div class="bg-slate-50/50 rounded-xl border border-slate-200 p-4 lg:p-6 min-h-[600px] relative">
                    <div class="flex flex-col sm:flex-row justify-between items-end sm:items-center mb-6 border-b border-slate-200 pb-4 gap-2">
                        <div>
                            <h3 class="text-xl font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-list-check text-indigo-500"></i> Registro de Actividad</h3>
                            <p class="text-sm text-slate-500 mt-1">Visualización en tiempo real de ingresos, salidas y transacciones.</p>
                        </div>
                        <div class="text-right">
                            <span class="block text-xs font-bold text-slate-400 uppercase tracking-wider">Registros Visibles</span>
                            <span class="text-sm font-mono font-medium text-slate-700" id="pageInfo">0 - 0 de 0</span>
                        </div>
                    </div>
                    
                    <!-- Feed de Tarjetas (Cards) -->
                    <div id="historyFeed" class="grid grid grid-cols-1 gap-4"></div>

                    <!-- Paginación -->
                    <div class="flex justify-center mt-8 pt-6 border-t border-slate-200">
                        <div id="pageControls" class="flex gap-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Lógica Menú Móvil
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobileMenuOverlay');
            
            if (sidebar.classList.contains('-translate-x-full')) {
                // Abrir
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                // Cerrar
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        // Inicialización de Fecha
        document.addEventListener('DOMContentLoaded', () => {
            const dateEl = document.getElementById("fecha-actual");
            if(dateEl) {
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }; 
                let dateStr = new Date().toLocaleDateString('es-ES', options);
                dateStr = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
                dateEl.textContent = dateStr;
            }
        });
    </script>
    
    <script src="../js/historial.js"></script>
</body>
</html>
