<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puestos | ParkingSys</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
    .custom-input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #cbd5e1; background-color: #fff; font-size: 14px; transition: all 0.2s; color: #1e293b; }
    .custom-input:focus { outline: none; border-color: #6366f1; background-color: #fff; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
    
    /* ESTILOS DE TARJETA */
    .parking-card {
      @apply relative bg-white border-2 rounded-xl overflow-hidden shadow-sm hover:shadow-lg transition-all duration-300 flex flex-col h-56 cursor-pointer;
    }
    .parking-card.libre { @apply border-slate-200 hover:border-emerald-400; }
    
    /* OCUPADO: Fondo azul oscuro, texto blanco */
    .parking-card.ocupado { 
      @apply border-indigo-900 bg-indigo-800 text-white shadow-xl; 
    }
    
    /* RESERVADO: Fondo morado claro, texto oscuro */
    .parking-card.reservado { 
      @apply border-purple-300 bg-purple-100 text-slate-800; 
    }
    
    /* AUSENCIA: Fondo amarillo claro, texto oscuro */
    .parking-card.ausencia { 
      @apply border-amber-400 border-2 border-dashed bg-amber-50 text-slate-800; 
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
  </style>
</head>

<body class="flex h-screen overflow-hidden text-slate-800">

  <!-- SIDEBAR -->
  <aside class="hidden lg:flex w-64 bg-white border-r border-slate-200 flex-col shadow-sm z-20">
    <div class="h-16 flex items-center px-6 border-b border-slate-100">
      <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center mr-3 shadow-lg shadow-indigo-200">
        <i class="fa-solid fa-square-parking text-white text-sm"></i>
      </div>
      <h1 class="text-lg font-bold text-slate-800">Parking<span class="text-indigo-600">Sys</span></h1>
    </div>

    <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
      <a href="/dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-colors">
        <i class="fa-solid fa-chart-pie w-5 text-center"></i> Dashboard
      </a>
      <a href="/pages/clientes.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-colors">
        <i class="fa-solid fa-users w-5 text-center"></i> Clientes
      </a>
      <a href="/pages/puestos.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium bg-indigo-50 text-indigo-700 shadow-sm ring-1 ring-indigo-100">
        <i class="fa-solid fa-layer-group w-5 text-center"></i> Puestos
      </a>
      <a href="/pages/caja.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-colors">
        <i class="fa-solid fa-cash-register w-5 text-center"></i> Caja
      </a>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
    <!-- Header -->
    <header class="h-16 bg-white/90 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-4 lg:px-8 sticky top-0 z-10">
      <div class="flex flex-col">
        <h2 class="text-xl font-bold text-slate-800">Mapa de Puestos</h2>
        <span class="text-xs text-slate-500 font-medium">Gestión de Tiempos y Reservas</span>
      </div>
      
      <div class="flex items-center gap-3">
        <button onclick="crearPuestoRapido()" class="px-3 py-2 bg-slate-800 text-white text-xs font-bold rounded-lg shadow hover:bg-slate-900 transition-colors items-center gap-2 hidden md:flex">
          <i class="fa-solid fa-plus"></i> Agregar Puesto
        </button>
        <button onclick="gestionarRegresos()" class="hidden md:flex px-3 py-2 bg-amber-500 text-white text-xs font-bold rounded-lg shadow hover:bg-amber-600 transition-colors items-center gap-2">
          <i class="fa-solid fa-user-clock"></i> Regresos
        </button>
        <button onclick="cargarPuestos()" class="w-9 h-9 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-500 hover:text-indigo-600 hover:border-indigo-200 shadow-sm transition-all" title="Refrescar">
          <i class="fa-solid fa-rotate"></i>
        </button>
      </div>
    </header>

    <!-- Dashboard Stats -->
    <div class="bg-white border-b border-slate-200 px-8 py-4">
      <div class="flex flex-col md:flex-row justify-between items-center gap-6">
        <div class="relative w-full md:w-64">
          <i class="fa-solid fa-search absolute left-3 top-3 text-slate-400 text-sm"></i>
          <input type="text" id="globalSearch" placeholder="Buscar puesto, placa o cliente..." class="w-full pl-9 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-indigo-500 bg-slate-50">
        </div>

        <div class="flex gap-4 w-full md:w-auto overflow-x-auto">
          <div class="bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 flex-1 flex flex-col items-center justify-center min-w-[80px]">
            <span class="text-xs text-slate-500 font-bold uppercase">Total</span>
            <span class="text-xl font-bold text-slate-800" id="stat-total">0</span>
          </div>
          <div class="bg-indigo-50 border border-indigo-200 rounded-lg px-4 py-2 flex-1 flex flex-col items-center justify-center min-w-[80px]">
            <span class="text-xs text-slate-600 font-bold uppercase">Ocupados</span>
            <span class="text-xl font-bold text-indigo-700" id="stat-ocupados">0</span>
          </div>
          <div class="bg-purple-50 border border-purple-200 rounded-lg px-4 py-2 flex-1 flex flex-col items-center justify-center min-w-[80px]">
            <span class="text-xs text-slate-600 font-bold uppercase">Reservados</span>
            <span class="text-xl font-bold text-purple-700" id="stat-reservados">0</span>
          </div>
          <div class="bg-amber-50 border border-amber-200 rounded-lg px-4 py-2 flex-1 flex flex-col items-center justify-center min-w-[80px]">
            <span class="text-xs text-slate-600 font-bold uppercase">Ausencias</span>
            <span class="text-xl font-bold text-amber-700" id="stat-ausencias">0</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Mapa -->
    <div class="flex-1 overflow-y-auto p-8 custom-scroll bg-slate-50/50">
      <div id="map-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6 pb-20"></div>
    </div>
  </main>

  <!-- MODAL: ASIGNAR / RESERVAR -->
  <div id="modalAsignar" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-[50]">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg mx-4 transform transition-all scale-95 opacity-0" id="modalContent">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50 rounded-t-2xl">
        <h3 class="text-lg font-bold text-slate-800" id="modalSpotNumber">Asignar Vehículo</h3>
        <button onclick="cerrarModalAsignar()" class="text-slate-400 hover:text-slate-600 w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-200 transition-colors">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="p-6 space-y-5">
        
        <!-- Selector de Cliente -->
        <div class="space-y-2 relative z-30">
          <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Seleccionar Cliente</label>
          <div class="grid grid-cols-3 gap-2">
            <div class="col-span-2 relative">
              <input type="text" id="modalNombre" readonly placeholder="Haz clic en Ver Lista" 
                     class="custom-input bg-slate-100 cursor-pointer pl-3 text-sm font-medium text-slate-700" onclick="toggleListaClientes()">
              <i class="fa-solid fa-chevron-down absolute right-3 top-3 text-slate-500 pointer-events-none"></i>
              
              <div id="listaResultadosClientes" class="border border-slate-200 rounded-xl max-h-60 overflow-y-auto hidden bg-white shadow-lg absolute w-full z-40 top-[45px]">
                <!-- JS -->
              </div>
            </div>
            <button type="button" onclick="toggleListaClientes()" class="bg-indigo-50 text-indigo-700 border border-indigo-200 rounded-lg text-xs font-bold hover:bg-indigo-100 transition-colors">
              Ver Lista
            </button>
          </div>
        </div>

        <div class="relative flex py-2 items-center">
          <div class="flex-grow border-t border-slate-200"></div>
          <span class="flex-shrink-0 mx-4 text-slate-400 text-xs font-medium">O ingresa nuevo</span>
          <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre</label>
            <input id="modalNombreManual" class="custom-input text-sm" placeholder="Nombre completo">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Placa</label>
            <input id="modalPlaca" class="custom-input text-sm uppercase" placeholder="ABC-123">
          </div>
        </div>
        
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Tipo Vehículo</label>
                <select id="modalTipo" class="custom-input text-sm bg-white">
                  <option value="Carro">Carro</option>
                  <option value="Moto">Moto</option>
                  <option value="Camioneta">Camioneta</option>
                </select>
            </div>
            <!-- NUEVO: Selector de Tiempo -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Tiempo de Estancia</label>
                <select id="modalTiempo" class="custom-input text-sm bg-white">
                  <option value="noche">Noche (Horas)</option>
                  <option value="dia">Día (24h)</option>
                  <option value="semana">Semana</option>
                  <option value="mes">Mes</option>
                </select>
            </div>
        </div>
        
        <!-- Checkbox para Reserva -->
        <div class="flex items-center gap-2 mt-2">
            <input type="checkbox" id="esReservaCheck" class="w-4 h-4 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500">
            <label for="esReservaCheck" class="text-sm font-medium text-slate-700">Marcar como Reserva (Sin entrar aún)</label>
        </div>

      </div>

      <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 rounded-b-2xl flex justify-end gap-3">
        <button onclick="cerrarModalAsignar()" class="px-5 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-200 transition-colors">Cancelar</button>
        <button onclick="confirmarAsignar()" class="px-5 py-2.5 rounded-lg text-sm font-bold bg-indigo-600 text-white hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition-all">
          Guardar
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL: SALIDA TEMPORAL -->
  <div id="modalSalida" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-[50]">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4 transform transition-all scale-95 opacity-0">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-amber-50/50 rounded-t-2xl">
        <h3 class="text-lg font-bold text-slate-800">Salida Temporal</h3>
        <button onclick="cerrarModalSalida()" class="text-slate-400 hover:text-slate-600 w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-200 transition-colors">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="p-6 space-y-4">
        <div class="bg-amber-50 text-amber-900 p-4 rounded-lg text-sm border border-amber-100 leading-relaxed">
          <i class="fa-solid fa-circle-info mr-2"></i>
          El cliente se va temporalmente. El puesto quedará libre para otro vehículo, pero se reservará su lugar.
        </div>
        <input type="hidden" id="salidaPuestoId">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Fecha de regreso</label>
          <input type="date" id="fechaRegreso" class="custom-input">
        </div>
      </div>
      <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 rounded-b-2xl flex justify-between items-center">
        <button onclick="cerrarModalSalida(); liberarPuesto(document.getElementById('salidaPuestoId').value)" class="text-rose-600 hover:bg-rose-50 px-4 py-2 rounded-lg text-sm font-medium transition-colors border border-rose-200">
          Finalizar Mes
        </button>
        <div class="flex gap-2">
          <button onclick="cerrarModalSalida()" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-200 transition-colors">Cancelar</button>
          <button onclick="confirmarSalidaTemporal()" class="px-4 py-2 rounded-lg text-sm font-medium bg-amber-500 text-white hover:bg-amber-600 shadow-md shadow-amber-200 transition-colors">
            Activar
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let allSpots = [];
    let clientesCache = [];
    let puestoSeleccionado = null;

    // --- UTILIDADES ---
    function mostrarToast(mensaje, tipo = 'success') {
      const toastExistente = document.getElementById('custom-toast');
      if (toastExistente) toastExistente.remove();
      const toast = document.createElement('div');
      toast.id = 'custom-toast';
      const colores = tipo === 'error' ? 'bg-red-50 text-red-800 border-red-200' : 'bg-emerald-50 text-emerald-800 border-emerald-200';
      const icono = tipo === 'error' ? '<i class="fa-solid fa-circle-exclamation"></i>' : '<i class="fa-solid fa-circle-check"></i>';
      toast.className = `fixed top-5 right-5 z-[60] flex items-center gap-3 px-6 py-4 rounded-xl shadow-xl border ${colores} transform transition-all duration-300 translate-x-full opacity-0 max-w-sm`;
      toast.innerHTML = `<span class="text-lg shrink-0">${icono}</span><span class="font-medium text-sm">${mensaje}</span>`;
      document.body.appendChild(toast);
      requestAnimationFrame(() => toast.classList.remove('translate-x-full', 'opacity-0'));
      setTimeout(() => { toast.classList.add('translate-x-full', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
    }

    document.addEventListener("DOMContentLoaded", () => {
      cargarPuestos();
      cargarClientesCache();
    });

    async function cargarClientesCache() {
      try {
        const res = await fetch("/api/clientes");
        clientesCache = await res.json();
        renderListaClientesDropdown();
      } catch (e) { console.error("Error cargando clientes", e); }
    }

    async function cargarPuestos() {
      try {
        const res = await fetch("/api/puestos");
        if (!res.ok) throw new Error("Error API");
        allSpots = await res.json();
        allSpots.sort((a, b) => {
          const numA = parseInt(a.numero.replace(/\D/g, '')) || 0;
          const numB = parseInt(b.numero.replace(/\D/g, '')) || 0;
          return numA - numB;
        });
        actualizarEstadisticas();
        renderMapa();
      } catch (error) { console.error(error); mostrarToast("Error cargando mapa", "error"); }
    }

    function actualizarEstadisticas() {
      const total = allSpots.length;
      const ocupados = allSpots.filter(s => s.estado === 'ocupado').length;
      const reservados = allSpots.filter(s => s.estado === 'reservado').length;
      let ausencias = 0;
      allSpots.forEach(s => {
        if(s.llave_caracteristicas) {
          try { if(JSON.parse(s.llave_caracteristicas).tipo === 'ausencia') ausencias++; } catch(e){}
        }
      });
      document.getElementById('stat-total').innerText = total;
      document.getElementById('stat-ocupados').innerText = ocupados;
      document.getElementById('stat-reservados').innerText = reservados;
      document.getElementById('stat-ausencias').innerText = ausencias;
    }

    // --- RENDERIZADO ---
    function renderMapa() {
      const container = document.getElementById("map-container");
      const searchVal = document.getElementById("globalSearch").value.toLowerCase();
      container.innerHTML = "";

      let datosFiltrados = allSpots;
      if (searchVal) {
        datosFiltrados = allSpots.filter(s => 
          s.numero.toLowerCase().includes(searchVal) || 
          (s.cliente_placa && s.cliente_placa.toLowerCase().includes(searchVal)) ||
          (s.cliente_nombre && s.cliente_nombre.toLowerCase().includes(searchVal))
        );
      }

      if (datosFiltrados.length === 0) {
        container.innerHTML = `<div class="col-span-full flex flex-col items-center justify-center text-slate-400 py-20"><i class="fa-solid fa-ghost text-4xl mb-3"></i><p class="text-lg font-medium">No se encontraron puestos.</p></div>`;
        return;
      }

      datosFiltrados.forEach(spot => {
        let esAusencia = false;
        let infoAusencia = null;
        let hayPasajero = false; // Nuevo estado lógico

        if (spot.llave_caracteristicas) {
          try {
            const parsed = JSON.parse(spot.llave_caracteristicas);
            if (parsed.tipo === 'ausencia') {
              esAusencia = true;
              infoAusencia = parsed;
              // Si hay un cliente actual, es un pasajero ocupando la ausencia
              if(spot.estado === 'ocupado') hayPasajero = true; 
            }
          } catch(e) {}
        }

        let colorClass = "parking-card libre"; 
        let btnAction = '';
        let infoCliente = '<div class="flex items-center justify-center h-full text-slate-400 font-medium text-sm">Disponible</div>';

        if (esAusencia) {
          colorClass = "parking-card.ausencia";
          // Texto OSCURO sobre fondo amarillo claro
          infoCliente = `
            <div class="text-amber-800 font-bold text-sm mb-1"><i class="fa-regular fa-clock"></i> Ausencia</div>
            <div class="text-xs text-amber-700 bg-white/80 px-2 py-1 rounded inline-block border border-amber-200">Regresa: ${formatearFecha(infoAusencia.fecha_regreso)}</div>
            ${hayPasajero ? '<div class="mt-2 text-xs font-bold text-red-600 bg-red-100 px-2 py-1 rounded border border-red-200"><i class="fa-solid fa-user-secret"></i> Ocupado por Pasajero</div>' : ''}
          `;
          btnAction = `<button onclick="abrirModalEntrada(${spot.id}, true)" class="w-full py-2.5 bg-amber-500 hover:bg-amber-600 text-white rounded-lg font-bold text-xs shadow-md transition-transform active:scale-95">Asignar Pasajero</button>`;
        } else if (spot.estado === 'ocupado') {
          colorClass = "parking-card.ocupado";
          // Texto BLANCO sobre fondo oscuro
          infoCliente = `
            <div class="text-white font-bold text-base truncate mb-1 drop-shadow-md">${spot.cliente_nombre}</div>
            <div class="text-indigo-200 text-xs font-mono uppercase tracking-wide border border-indigo-400/40 rounded px-2 py-0.5 inline-block bg-indigo-900/40 shadow-inner">${spot.cliente_placa || '---'}</div>
            ${spot.llave_caracteristicas ? '<div class="mt-1 text-[10px] text-indigo-300 font-medium"><i class="fa-solid fa-tag"></i> ' + (JSON.parse(spot.llave_caracteristicas).tiempo || '') + '</div>' : ''}
          `;
          btnAction = `<button onclick="abrirModalSalida(${spot.id})" class="w-full py-2.5 bg-white/20 hover:bg-white/30 text-white rounded-lg font-bold text-xs backdrop-blur-sm transition-transform active:scale-95">Salir / Ausencia</button>`;
        } else if (spot.estado === 'reservado') {
          colorClass = "parking-card.reservado";
          // Texto OSCURO sobre fondo morado claro
          infoCliente = `
            <div class="text-purple-900 font-bold text-base truncate mb-1">${spot.cliente_nombre || 'Reserva'}</div>
            <div class="text-purple-600 text-xs font-mono uppercase">${spot.cliente_placa || '---'}</div>
          `;
          btnAction = `<button onclick="abrirModalEntrada(${spot.id}, false)" class="w-full py-2.5 bg-indigo-500 hover:bg-indigo-600 text-white rounded-lg font-bold text-xs shadow-md transition-transform active:scale-95">Ingresar</button>`;
        } else {
          btnAction = `<button onclick="abrirModalEntrada(${spot.id}, false)" class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white rounded-lg font-bold text-xs shadow-md transition-transform active:scale-95">Ingresar</button>`;
        }

        const card = document.createElement("div");
        card.className = `${colorClass} animate-fade-in`;
        card.innerHTML = `
          <div class="flex-1 flex flex-col justify-between p-5 relative">
            <div class="flex justify-between items-start mb-4">
              <div>
                <span class="text-[10px] font-bold uppercase tracking-wider ${esAusencia ? 'text-amber-700' : (spot.estado === 'ocupado' ? 'text-indigo-300' : (spot.estado === 'reservado' ? 'text-purple-500' : 'text-slate-400'))}">Puesto</span>
                <h3 class="text-3xl font-bold ${esAusencia ? 'text-amber-900' : (spot.estado === 'ocupado' ? 'text-white drop-shadow-sm' : (spot.estado === 'reservado' ? 'text-purple-900' : 'text-slate-800'))}">${spot.numero}</h3>
              </div>
              <div class="text-2xl opacity-40">
                 ${esAusencia ? '<i class="fa-solid fa-clock text-amber-600"></i>' : (spot.estado === 'ocupado' ? '<i class="fa-solid fa-car-side"></i>' : (spot.estado === 'reservado' ? '<i class="fa-solid fa-bookmark"></i>' : '<i class="fa-solid fa-square-parking"></i>'))}
              </div>
            </div>
            <div>${infoCliente}</div>
          </div>
          <div class="p-4 pt-0 mt-auto">${btnAction}</div>
        `;
        container.appendChild(card);
      });
    }

    // --- DROPDOWN CLIENTES ---
    function renderListaClientesDropdown() {
      const lista = document.getElementById("listaResultadosClientes");
      lista.innerHTML = '';
      if (clientesCache.length === 0) return;

      clientesCache.forEach(c => {
        const div = document.createElement("div");
        div.className = "p-3 hover:bg-indigo-50 cursor-pointer border-b border-slate-100 last:border-0 flex justify-between items-center transition-colors";
        div.innerHTML = `
          <div>
            <div class="font-bold text-sm text-slate-800">${c.nombre}</div>
            <div class="text-xs text-slate-500 mt-1"><i class="fa-solid fa-id-card mr-1"></i>${c.placa}</div>
          </div>
          <div class="bg-slate-100 text-slate-600 px-2 py-1 rounded text-xs font-semibold">${c.tipo_vehiculo || 'Auto'}</div>
        `;
        div.onclick = () => seleccionarClienteModal(c);
        lista.appendChild(div);
      });
    }

    window.toggleListaClientes = function() {
      const lista = document.getElementById("listaResultadosClientes");
      lista.classList.toggle('hidden');
    };

    document.addEventListener('click', function(event) {
      const container = document.querySelector('.relative.z-30');
      const lista = document.getElementById("listaResultadosClientes");
      if (container && !container.contains(event.target) && !lista.classList.contains('hidden')) {
        lista.classList.add('hidden');
      }
    });

    window.seleccionarClienteModal = function(cliente) {
      document.getElementById("modalNombre").value = cliente.nombre;
      document.getElementById("modalNombreManual").value = cliente.nombre;
      document.getElementById("modalPlaca").value = cliente.placa;
      document.getElementById("modalTipo").value = cliente.tipo_vehiculo || 'Carro';
      document.getElementById("listaResultadosClientes").classList.add('hidden');
    }

    // --- MODALES ---
    window.abrirModalEntrada = function(id, esPasajero) {
      puestoSeleccionado = allSpots.find(s => s.id === id);
      if(!puestoSeleccionado) return;

      document.getElementById("modalSpotNumber").innerText = esPasajero ? "Asignar Carro Pasajero" : "Asignar Vehículo";
      
      document.getElementById("modalNombre").value = '';
      document.getElementById("modalNombreManual").value = '';
      document.getElementById("modalPlaca").value = '';
      document.getElementById("modalTipo").value = 'Carro';
      document.getElementById("modalTiempo").value = 'dia';
      document.getElementById("esReservaCheck").checked = false;
      document.getElementById("listaResultadosClientes").classList.add('hidden');

      const modal = document.getElementById("modalAsignar");
      const content = document.getElementById("modalContent");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
      setTimeout(() => {
        content.classList.remove("scale-95", "opacity-0");
        content.classList.add("scale-100", "opacity-100");
      }, 10);
    }

    window.abrirModalSalida = function(id) {
      document.getElementById('salidaPuestoId').value = id;
      const manana = new Date(); manana.setDate(manana.getDate() + 5);
      document.getElementById('fechaRegreso').valueAsDate = manana;

      const modal = document.getElementById("modalSalida");
      const content = modal.querySelector('div');
      modal.classList.remove("hidden");
      modal.classList.add("flex");
      setTimeout(() => {
        content.classList.remove("scale-95", "opacity-0");
        content.classList.add("scale-100", "opacity-100");
      }, 10);
    }

    window.cerrarModalSalida = function() {
      const modal = document.getElementById("modalSalida");
      const content = modal.querySelector('div');
      content.classList.add("scale-95", "opacity-0");
      content.classList.remove("scale-100", "opacity-100");
      setTimeout(() => { modal.classList.add("hidden"); modal.classList.remove("flex"); }, 200);
    }

    window.cerrarModalAsignar = function() {
      const modal = document.getElementById("modalAsignar");
      const content = document.getElementById("modalContent");
      content.classList.add("scale-95", "opacity-0");
      content.classList.remove("scale-100", "opacity-100");
      setTimeout(() => { modal.classList.add("hidden"); modal.classList.remove("flex"); }, 200);
    }

    // --- LOGICA DE NEGOCIO ---

    window.confirmarSalidaTemporal = async function() {
      const id = document.getElementById('salidaPuestoId').value;
      const fecha = document.getElementById('fechaRegreso').value;

      try {
        const res = await fetch("/api/puestos", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: id, accion: "salida_temporal", fecha_regreso: fecha })
        });
        const data = await res.json();
        if (data.success) {
          mostrarToast("Ausencia activada. Puesto libre.");
          cerrarModalSalida();
          cargarPuestos();
        } else {
          mostrarToast("Error: " + (data.error || "Desconocido"), "error");
        }
      } catch (e) {
        console.error(e);
        mostrarToast("Error de conexión", "error");
      }
    }

    window.liberarPuesto = async function(id) {
      try {
        const res = await fetch("/api/puestos?id=" + id, { method: "PATCH" });
        if (res.ok) {
          mostrarToast("Puesto liberado");
          cargarPuestos();
        }
      } catch (e) { mostrarToast("Error", "error"); }
    }

    window.confirmarAsignar = async function() {
      let nombre = document.getElementById("modalNombreManual").value.trim();
      if (!nombre) nombre = document.getElementById("modalNombre").value.trim();
      
      const placa = document.getElementById("modalPlaca").value.trim().toUpperCase();
      const tipo = document.getElementById("modalTipo").value;
      const tiempo = document.getElementById("modalTiempo").value;
      const esReserva = document.getElementById("esReservaCheck").checked;
      
      if (!nombre || !placa) {
        mostrarToast("Nombre y Placa son obligatorios", "error");
        return;
      }

      let clienteId = null;
      const clienteExistente = clientesCache.find(c => c.placa === placa);

      if (clienteExistente) {
        clienteId = clienteExistente.id;
      } else {
        try {
          const resCliente = await fetch("/api/clientes", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nombre: String(nombre), telefono: "", placa: String(placa), tipo: String(tipo) })
          });
          const dataCliente = await resCliente.json();
          if (dataCliente.success) clienteId = dataCliente.id;
          else if (dataCliente.error) {
            await cargarClientesCache();
            const reintentar = clientesCache.find(c => c.placa === placa);
            if(reintentar) clienteId = reintentar.id;
          }
        } catch (e) {
          await cargarClientesCache();
          const found = clientesCache.find(c => c.placa === placa);
          if(found) clienteId = found.id;
        }
      }

      if (!clienteId) {
         await cargarClientesCache();
         const found = clientesCache.find(c => c.placa === placa);
         if(found) clienteId = found.id;
      }

      if (!clienteId) return mostrarToast("Error asignando cliente.", "error");

      // --- PERSISTENCIA DE AUSENCIA Y METADATOS ---
      let llavePayload = null;
      const estadoFinal = esReserva ? 'reservado' : 'ocupado';

      // 1. Si ya hay una ausencia, mantenemos los datos del dueño original
      if (puestoSeleccionado.llave_caracteristicas) {
        try {
          const infoActual = JSON.parse(puestoSeleccionado.llave_caracteristicas);
          if (infoActual.tipo === 'ausencia') {
            llavePayload = puestoSeleccionado.llave_caracteristicas; // No borramos la info de ausencia
          }
        } catch(e) {}
      }

      // 2. Si NO hay ausencia, pero sí asignamos un tiempo, lo guardamos en llave
      if (!llavePayload && !esReserva) {
          llavePayload = JSON.stringify({ tipo: 'estancia', tiempo: tiempo });
      }

      try {
        const resPuesto = await fetch("/api/puestos", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            id: puestoSeleccionado.id, 
            cliente_id: clienteId, 
            estado: estadoFinal,
            llave: llavePayload
          })
        });

        if (resPuesto.ok) {
          mostrarToast(esReserva ? "Reserva creada" : "Vehículo asignado");
          cerrarModalAsignar();
          cargarPuestos();
        } else {
          mostrarToast("Error asignando puesto", "error");
        }
      } catch (e) {
        console.error(e);
        mostrarToast("Error de conexión", "error");
      }
    }

    // --- GESTIÓN INTELIGENTE DE REGRESOS ---
    window.gestionarRegresos = function() {
      const puestosAusencia = allSpots.filter(s => {
        if (!s.llave_caracteristicas) return false;
        try { return JSON.parse(s.llave_caracteristicas).tipo === 'ausencia'; } catch(e) { return false; }
      });

      if (puestosAusencia.length === 0) return alert("No hay ausencias activas.");

      let msg = "Seleccione ID del puesto para REGRESO:\n\n";
      puestosAusencia.forEach(p => {
        const info = JSON.parse(p.llave_caracteristicas);
        const estadoActual = p.estado === 'ocupado' ? '(Ocupado por Pasajero)' : '(Libre)';
        msg += `${p.id}. Puesto #${p.numero} ${estadoActual}\n   Dueño: Regresa ${info.fecha_regreso}\n\n`;
      });
      
      const sel = prompt(msg);
      if (sel) procesarRegreso(sel);
    }

    async function procesarRegreso(puestoId) {
      const spot = allSpots.find(s => s.id == puestoId);
      if(!spot) return;
      const info = JSON.parse(spot.llave_caracteristicas);
      const clienteOriginalId = info.cliente_id_original;

      // Verificar si hay pasajero
      if (spot.estado === 'ocupado') {
        if(!confirm(`ATENCIÓN: El puesto está ocupado por ${spot.cliente_nombre}.\n\n¿Desalojarlo para devolverle el puesto al dueño original?`)) {
          return;
        }
      } else {
        if(!confirm("¿Restaurar cliente dueño en el puesto?")) return;
      }

      try {
        const res = await fetch("/api/puestos", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id: puestoId,
            cliente_id: clienteOriginalId,
            estado: 'ocupado',
            llave: null // Limpiamos la ausencia al restaurar
          })
        });

        if (res.ok) {
          mostrarToast("Cliente restaurado correctamente");
          cargarPuestos();
        }
      } catch (e) { mostrarToast("Error en regreso", "error"); }
    }

    window.crearPuestoRapido = async function() {
      const numero = prompt("Número del nuevo puesto:");
      if (!numero) return; 
      try {
        const res = await fetch("/api/puestos", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ numero })
        });
        const data = await res.json();
        if (data.success) {
          mostrarToast("Puesto creado");
          cargarPuestos();
        } else {
          mostrarToast("Error creando puesto", "error");
        }
      } catch (e) { mostrarToast("Error de conexión", "error"); }
    }

    function formatearFecha(isoStr) {
      if(!isoStr) return '';
      return new Date(isoStr).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
    }

    document.getElementById("globalSearch").addEventListener("input", renderMapa);

  </script>
</body>
</html>
