<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastos | ParkingSys</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .custom-input { background: #fff; border: 1px solid #cbd5e1; color: #334155; transition: all .3s ease; padding: 10px 12px; border-radius: 8px; width: 100%; }
        .custom-input:focus { border-color: #f97316; outline: 0; box-shadow: 0 0 0 3px rgba(249,115,22,.1); }
        ::-webkit-scrollbar { width: 6px; height: 6px; } ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-700 antialiased flex h-screen overflow-hidden">

    <!-- MOBILE MENU OVERLAY -->
    <div id="mobileMenuOverlay" onclick="toggleMenu()" class="fixed inset-0 bg-slate-900/50 z-30 hidden lg:hidden backdrop-blur-sm"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-white border-r border-slate-200 transform -translate-x-full lg:translate-x-0 lg:static lg:inset-auto transition-transform duration-300">
        <div class="h-16 flex items-center px-8 border-b border-slate-100">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/30"><i class="fa-solid fa-square-parking text-sm"></i></div>
                <h1 class="text-xl font-bold text-slate-800 tracking-tight">PARKING<span class="text-blue-600">SYS</span></h1>
            </div>
        </div>
        <nav class="flex-1 overflow-y-auto py-6 px-4 space-y-1">
            <p class="px-4 text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Menú</p>
            <a href="../dashboard.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-xl font-medium transition-colors nav-item"><i class="fa-solid fa-chart-line w-5 text-slate-400 group-hover:text-blue-500"></i><span>Dashboard</span></a>
            <a href="clientes.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-xl font-medium transition-colors nav-item"><i class="fa-solid fa-users w-5 text-slate-400"></i><span>Clientes</span></a>
            <a href="puestos.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-xl font-medium transition-colors nav-item"><i class="fa-solid fa-layer-group w-5 text-slate-400"></i><span>Puestos</span></a>
            <a href="caja.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-xl font-medium transition-colors nav-item"><i class="fa-solid fa-cash-register w-5 text-slate-400"></i><span>Caja</span></a>
            
            <!-- Gastos Active -->
            <a href="gastos.html" class="flex items-center gap-3 px-4 py-3 bg-orange-50 text-orange-600 rounded-xl font-medium transition-colors nav-item"><i class="fa-solid fa-receipt w-5"></i><span>Gastos</span></a>
            
            <a href="historial.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-xl font-medium transition-colors nav-item"><i class="fa-solid fa-clock-rotate-left w-5 text-slate-400"></i><span>Historial</span></a>
            <a href="configuracion.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-xl font-medium transition-colors nav-item"><i class="fa-solid fa-gear w-5 text-slate-400"></i><span>Configuración</span></a>
        </nav>
        <div class="p-4 border-t border-slate-100">
            <button onclick="cerrarSesion()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold text-red-600 hover:bg-red-50 border border-red-100 transition-colors"><i class="fa-solid fa-power-off"></i> Cerrar Sesión</button>
        </div>
    </aside>

    <!-- MAIN CONTENT WRAPPER -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header class="h-16 bg-white/80 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-8 z-20 sticky top-0">
            <div class="flex items-center gap-4">
                <button onclick="toggleMenu()" class="lg:hidden p-2 text-slate-600 hover:bg-slate-100 rounded-lg"><i class="fa-solid fa-bars text-xl"></i></button>
                <h2 class="text-xl font-bold text-slate-800">Control de Gastos</h2>
            </div>
            <div class="flex items-center gap-3"><span class="text-sm font-medium text-slate-500 bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm" id="fecha-actual"></span></div>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl border border-slate-100 shadow-sm flex flex-col border-l-4 border-l-orange-500">
                    <span class="text-xs font-bold text-orange-500 uppercase tracking-wider">Total Gastado</span>
                    <span class="text-3xl font-bold text-slate-800 mt-1 font-mono" id="kpiTotal">$0.00</span>
                </div>
                <div class="bg-white p-6 rounded-xl border border-slate-100 shadow-sm flex flex-col">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Mayor Gasto</span>
                    <div class="mt-2"><p class="text-sm font-bold text-slate-800 truncate">-</p><p class="text-xs text-slate-500">$0.00</p></div>
                </div>
                <div class="bg-white p-6 rounded-xl border border-slate-100 shadow-sm flex flex-col">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Registros</span>
                    <span class="text-3xl font-bold text-slate-800 mt-1">0</span>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-1">
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 sticky top-0">
                        <div class="flex items-center gap-3 mb-6 border-b border-slate-100 pb-4">
                            <div class="w-10 h-10 rounded-full bg-orange-50 flex items-center justify-center text-orange-600"><i class="fa-solid fa-receipt text-lg"></i></div>
                            <h3 class="text-lg font-bold text-slate-800">Nuevo Gasto</h3>
                        </div>
                        <form id="formGasto" class="space-y-4">
                            <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">Concepto</label><input type="text" placeholder="Ej. Bombillos" class="custom-input text-sm" required></div>
                            <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">Categoría</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-tag"></i></span>
                                    <select class="custom-input pl-10 pr-4 py-2.5 rounded-lg text-sm appearance-none bg-white">
                                        <option>Mantenimiento</option><option>Servicios</option><option>Insumos</option><option>Otros</option>
                                    </select>
                                    <span class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 pointer-events-none"><i class="fa-solid fa-chevron-down text-xs"></i></span>
                                </div>
                            </div>
                            <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">Monto ($)</label>
                                <div class="relative"><span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 font-bold">$</span><input type="number" step="0.01" placeholder="0.00" class="custom-input pl-8 pr-4 py-2.5 rounded-lg text-sm font-mono font-bold" required></div>
                            </div>
                            <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-all flex justify-center items-center gap-2"><i class="fa-solid fa-save"></i> Guardar</button>
                        </form>
                    </div>
                </div>
                <div class="lg:col-span-2">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden h-full flex flex-col">
                        <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                            <h3 class="text-lg font-bold text-slate-800">Historial de Egresos</h3>
                        </div>
                        <div class="flex-1 overflow-auto p-0">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-slate-50 text-slate-500 text-xs uppercase sticky top-0 z-10">
                                    <tr><th class="px-6 py-3 font-semibold">Fecha</th><th class="px-6 py-3 font-semibold">Concepto</th><th class="px-6 py-3 text-right font-semibold">Monto</th></tr>
                                </thead>
                                <tbody id="listaGastosBody" class="text-sm text-slate-700 divide-y divide-slate-100">
                                    <tr><td class="px-6 py-4">-</td><td class="px-6 py-4">Sin registros</td><td class="px-6 py-4 text-right">-</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('formGasto').addEventListener('submit', (e) => { e.preventDefault(); alert('Gasto guardado (Simulación)'); e.target.reset(); });
        document.getElementById('fecha-actual').innerText = new Date().toLocaleDateString('es-ES');
        function toggleMenu() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('mobileMenuOverlay').classList.toggle('hidden'); }
        function cerrarSesion() { if(confirm('Salir?')) window.location.href='../index.html'; }
    </script>
</body>
</html>
