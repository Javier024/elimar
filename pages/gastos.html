<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastos - Parqueadero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .elegant-input { background: #ffffff; border: 1px solid #cbd5e1; color: #334155; transition: all 0.3s ease; }
        .elegant-input:focus { border-color: #f97316; outline: none; box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1); } /* Focus Naranja */
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .page-btn { transition: all 0.2s; }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body class="text-slate-700 antialiased flex h-screen overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col shadow-[4px_0_24px_rgba(0,0,0,0.02)] z-20">
        <div class="h-16 flex items-center px-8 border-b border-slate-100">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-square-parking text-sm"></i>
                </div>
                <h1 class="text-xl font-bold text-slate-800 tracking-tight">PARKING<span class="text-blue-600">SYS</span></h1>
            </div>
        </div>
        <nav class="flex-1 overflow-y-auto py-6 px-4 space-y-1">
            <p class="px-4 text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Menú</p>
            <a href="../dashboard.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-xl font-medium transition-colors group"><i class="fa-solid fa-chart-line w-5 text-slate-400 group-hover:text-blue-500"></i> <span>Dashboard</span></a>
            <a href="clientes.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-xl font-medium transition-colors group"><i class="fa-solid fa-users w-5 text-slate-400 group-hover:text-blue-500"></i> <span>Clientes</span></a>
            <a href="puestos.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-xl font-medium transition-colors group"><i class="fa-solid fa-layer-group w-5 text-slate-400 group-hover:text-blue-500"></i> <span>Puestos</span></a>
            <a href="caja.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-xl font-medium transition-colors group"><i class="fa-solid fa-cash-register w-5 text-slate-400 group-hover:text-blue-500"></i> <span>Caja</span></a>
            
            <!-- ACTIVO -->
            <a href="gastos.html" class="flex items-center gap-3 px-4 py-3 bg-orange-50 text-orange-600 rounded-xl font-medium transition-colors group"><i class="fa-solid fa-receipt w-5"></i> <span>Gastos</span></a>
            
            <a href="historial.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-xl font-medium transition-colors group"><i class="fa-solid fa-clock-rotate-left w-5 text-slate-400 group-hover:text-blue-500"></i> <span>Historial</span></a>
            <a href="configuracion.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-xl font-medium transition-colors group"><i class="fa-solid fa-gear w-5 text-slate-400 group-hover:text-blue-500"></i> <span>Configuración</span></a>
        </nav>
        <div class="p-4 border-t border-slate-100">
            <div class="flex items-center gap-3 p-2 rounded-xl hover:bg-slate-50 transition cursor-pointer">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-yellow-600 to-yellow-400 border-2 border-white shadow-sm"></div>
                <div><p class="text-sm font-semibold text-slate-800">Admin</p><p class="text-xs text-emerald-500">En línea</p></div>
            </div>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header class="h-16 bg-white/80 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-8 z-30 sticky top-0">
            <h2 class="text-xl font-bold text-slate-800">Control de Gastos</h2>
            <div class="flex items-center gap-3">
                <span class="text-sm font-medium text-slate-500 bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm" id="fecha-actual"></span>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
            
            <!-- KPI CARDS -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl border border-slate-100 shadow-sm flex flex-col border-l-4 border-l-orange-500">
                    <span class="text-xs font-bold text-orange-500 uppercase tracking-wider">Total Gastado</span>
                    <span class="text-3xl font-bold text-slate-800 mt-1 font-mono" id="kpiTotal">$0.00</span>
                </div>
                <div class="bg-white p-6 rounded-xl border border-slate-100 shadow-sm flex flex-col">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Mayor Gasto</span>
                    <div class="mt-2">
                        <p class="text-sm font-bold text-slate-800 truncate" id="kpiTopConcept">-</p>
                        <p class="text-xs text-slate-500" id="kpiTopAmount">$0.00</p>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl border border-slate-100 shadow-sm flex flex-col">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Registros</span>
                    <span class="text-3xl font-bold text-slate-800 mt-1" id="kpiCount">0</span>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <!-- IZQUIERDA: FORMULARIO -->
                <div class="lg:col-span-1">
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 sticky top-0">
                        <div class="flex items-center gap-3 mb-6 border-b border-slate-100 pb-4">
                            <div class="w-10 h-10 rounded-full bg-orange-50 flex items-center justify-center text-orange-600">
                                <i class="fa-solid fa-receipt text-lg"></i>
                            </div>
                            <h3 class="text-lg font-bold text-slate-800">Nuevo Gasto</h3>
                        </div>

                        <form id="formGasto" onsubmit="event.preventDefault(); guardarGasto();">
                            <div class="mb-4">
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Concepto / Descripción</label>
                                <input type="text" id="gastoConcepto" placeholder="Ej. Cambio de bombillos" class="elegant-input w-full px-4 py-2.5 rounded-lg text-sm" required>
                            </div>

                            <div class="mb-4">
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Categoría</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                                        <i class="fa-solid fa-tag"></i>
                                    </span>
                                    <select id="gastoCategoria" class="elegant-input w-full pl-10 pr-4 py-2.5 rounded-lg text-sm appearance-none bg-white">
                                        <option value="Mantenimiento">Mantenimiento</option>
                                        <option value="Servicios">Servicios Públicos</option>
                                        <option value="Nómina">Nómina / Sueldos</option>
                                        <option value="Insumos">Insumos / Limpieza</option>
                                        <option value="Impuestos">Impuestos</option>
                                        <option value="Otros">Otros</option>
                                    </select>
                                    <span class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 pointer-events-none">
                                        <i class="fa-solid fa-chevron-down text-xs"></i>
                                    </span>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Monto ($)</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 font-bold">$</span>
                                    <input type="number" id="gastoMonto" step="0.01" placeholder="0.00" class="elegant-input w-full pl-8 pr-4 py-2.5 rounded-lg text-sm font-mono font-bold text-lg" required>
                                </div>
                            </div>

                            <div class="mb-6">
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Fecha</label>
                                <input type="date" id="gastoFecha" class="elegant-input w-full px-4 py-2.5 rounded-lg text-sm">
                            </div>

                            <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition-all duration-200 flex justify-center items-center gap-2">
                                <i class="fa-solid fa-save"></i> Guardar Gasto
                            </button>
                        </form>
                    </div>
                </div>

                <!-- DERECHA: LISTA -->
                <div class="lg:col-span-2">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden h-full flex flex-col">
                        <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                            <h3 class="text-lg font-bold text-slate-800">Historial de Egresos</h3>
                            <div class="relative">
                                <input type="text" placeholder="Buscar gasto..." class="pl-9 pr-4 py-1.5 text-sm border border-slate-300 rounded-full focus:outline-none focus:border-orange-500 bg-white">
                                <i class="fa-solid fa-search absolute left-3 top-2 text-gray-400 text-xs"></i>
                            </div>
                        </div>
                        
                        <div class="flex-1 overflow-auto p-0">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-slate-50 text-slate-500 text-xs uppercase sticky top-0 z-10">
                                    <tr>
                                        <th class="px-6 py-3 font-semibold">Fecha</th>
                                        <th class="px-6 py-3 font-semibold">Concepto</th>
                                        <th class="px-6 py-3 font-semibold">Categoría</th>
                                        <th class="px-6 py-3 text-right font-semibold">Monto</th>
                                        <th class="px-6 py-3 text-right font-semibold">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="listaGastosBody" class="text-sm text-slate-700 divide-y divide-slate-100">
                                    <!-- JS Render -->
                                </tbody>
                            </table>
                        </div>

                        <div class="bg-slate-50 px-6 py-4 border-t border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4">
                            <span class="text-xs text-slate-500" id="paginationInfo">Mostrando 0 a 0 de 0 registros</span>
                            <div class="flex items-center gap-1" id="paginationControls"></div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- MODAL EDITAR GASTO -->
    <div id="modalEdit" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4 overflow-hidden border border-slate-100">
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-800">Editar Gasto</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-times text-xl"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="editId">
                <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">Concepto</label><input type="text" id="editConcepto" class="elegant-input w-full p-2 rounded text-sm"></div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Categoría</label>
                        <select id="editCategoria" class="elegant-input w-full p-2 rounded text-sm">
                            <option value="Mantenimiento">Mantenimiento</option>
                            <option value="Servicios">Servicios</option>
                            <option value="Nómina">Nómina</option>
                            <option value="Insumos">Insumos</option>
                            <option value="Impuestos">Impuestos</option>
                            <option value="Otros">Otros</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Fecha</label>
                        <input type="date" id="editFecha" class="elegant-input w-full p-2 rounded text-sm">
                    </div>
                </div>
                <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">Monto</label><input type="number" id="editMonto" class="elegant-input w-full p-2 rounded text-sm font-mono"></div>
            </div>
            <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex justify-end gap-3">
                <button onclick="deleteGastoFromModal()" class="px-4 py-2 text-sm font-medium text-red-600 bg-white border border-red-200 rounded-lg hover:bg-red-50">Eliminar</button>
                <button onclick="updateGasto()" class="px-4 py-2 text-sm font-medium text-white bg-orange-500 rounded-lg hover:bg-orange-600">Actualizar</button>
            </div>
        </div>
    </div>

 <!-- JS GASTOS -->
<script src="/js/gastos.js"></script>

</body>
</html>
