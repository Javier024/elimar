<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastos | PARQUEADERO ELIMAR</title>
    <link rel="icon" type="image/jpeg" href="/img/logo.jpg">
    
    <!-- 1. TAILWIND + CONFIGURACIÓN DARK MODE -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- 2. CARGAR TEMA (Anti-parpadeo) -->
    <script src="../js/theme.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Scrollbar personalizado */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        /* Inputs - Modo Claro */
        .custom-input { background: #fff; border: 1px solid #cbd5e1; color: #334155; transition: all .3s ease; padding: 12px 12px 12px 40px; border-radius: 8px; width: 100%; font-size: 15px; }
        .custom-input:focus { border-color: #6366f1; outline: 0; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); }
        .input-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8; }

        /* Inputs - Modo Oscuro */
        .dark .custom-input { background: #1e293b; border-color: #334155; color: #f1f5f9; }
        .dark .custom-input:focus { border-color: #818cf8; box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2); }
        .dark .input-icon { color: #64748b; }
    </style>
</head>

<!-- 3. BODY CON CLASES DARK -->
<body class="text-slate-700 dark:text-slate-300 antialiased flex flex-col lg:flex-row h-screen overflow-hidden bg-slate-50 dark:bg-slate-900 w-full transition-colors duration-300">

    <!-- MOBILE MENU OVERLAY -->
    <div id="mobileMenuOverlay" onclick="toggleMenu()" class="fixed inset-0 bg-slate-900/50 dark:bg-black/70 z-40 hidden backdrop-blur-sm transition-opacity"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col lg:static lg:z-auto lg:flex lg:flex-col shadow-xl lg:shadow-none">
        
        <div class="h-16 flex items-center px-6 border-b border-slate-100 dark:border-slate-700 shrink-0">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center mr-3 shadow-lg shadow-indigo-200 dark:shadow-indigo-900/30 flex-shrink-0">
                <i class="fa-solid fa-square-parking text-white text-sm"></i>
            </div>
            <div class="min-w-0">
                <h1 class="text-lg font-bold text-slate-800 dark:text-white truncate">ELI<span class="text-indigo-600 dark:text-indigo-400">MAR</span></h1>
                <p class="text-[10px] text-slate-400 dark:text-slate-500 font-medium truncate" id="sidebar-user-name">Sistema</p>
            </div>
        </div>

        <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
            <a href="../dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors nav-item"><i class="fa-solid fa-chart-pie w-5 text-center"></i> Dashboard</a>
            <a href="clientes.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors nav-item"><i class="fa-solid fa-users w-5 text-center"></i> Clientes</a>
            <a href="puestos.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors nav-item"><i class="fa-solid fa-layer-group w-5 text-center"></i> Puestos</a>
            <a href="caja.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors nav-item"><i class="fa-solid fa-cash-register w-5 text-center"></i> Caja</a>
            
            <a href="gastos.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium bg-indigo-50 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300 shadow-sm ring-1 ring-indigo-100 dark:ring-indigo-800/50 nav-item"><i class="fa-solid fa-receipt w-5 text-center"></i> Gastos</a>
            
            <a href="historial.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors nav-item"><i class="fa-solid fa-clock-rotate-left w-5 text-center"></i> Historial</a>
            <a href="configuracion.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors nav-item"><i class="fa-solid fa-gear w-5 text-center"></i> Configuración</a>
        </nav>

        <div class="p-4 border-t border-slate-100 dark:border-slate-700 shrink-0 space-y-2">
            <!-- BOTÓN MODO OSCURO -->
            <button onclick="toggleTheme()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-600 transition-colors">
                <i class="fa-solid fa-sun theme-toggle-icon text-amber-500"></i> 
                <span class="theme-toggle-text">Modo Claro</span>
            </button>

            <button onclick="logout()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 border border-red-100 dark:border-red-900/50 transition-colors">
                <i class="fa-solid fa-power-off"></i> Cerrar Sesión
            </button>
        </div>
    </aside>

    <!-- MAIN CONTENT WRAPPER -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative w-full bg-slate-50 dark:bg-slate-900">
        
        <header class="h-16 bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 flex items-center justify-between px-4 lg:px-8 sticky top-0 z-20 shrink-0 shadow-sm">
            <div class="flex items-center gap-4">
                <button onclick="toggleMenu()" class="lg:hidden p-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <div>
                    <h2 class="text-lg lg:text-xl font-bold text-slate-800 dark:text-white">Control de Gastos</h2>
                    <span class="text-xs text-slate-500 dark:text-slate-400 hidden sm:block">Registro de egresos operativos</span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <i class="fa-regular fa-calendar text-slate-400 dark:text-slate-500"></i>
                <span id="fecha-actual" class="text-sm font-medium text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 px-3 py-1 rounded-full border border-slate-200 dark:border-slate-600"></span>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 lg:p-8">
            
            <!-- KPIs -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 lg:gap-6 mb-8">
                <div class="bg-white dark:bg-slate-800 p-4 lg:p-6 rounded-xl border border-slate-100 dark:border-slate-700 shadow-sm dark:shadow-none flex flex-col border-l-4 border-l-indigo-600">
                    <span class="text-xs font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-wider">Total Gastado</span>
                    <span class="text-2xl lg:text-3xl font-bold text-slate-800 dark:text-white mt-1 font-mono" id="kpiTotal">$0.00</span>
                </div>
                <div class="bg-white dark:bg-slate-800 p-4 lg:p-6 rounded-xl border border-slate-100 dark:border-slate-700 shadow-sm dark:shadow-none flex flex-col">
                    <span class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Mayor Gasto</span>
                    <div class="mt-2">
                        <p class="text-sm font-bold text-slate-800 dark:text-white truncate" id="kpiTopConcept">-</p>
                        <p class="text-xs text-slate-500 dark:text-slate-400" id="kpiTopAmount">$0.00</p>
                    </div>
                </div>
                <div class="bg-white dark:bg-slate-800 p-4 lg:p-6 rounded-xl border border-slate-100 dark:border-slate-700 shadow-sm dark:shadow-none flex flex-col">
                    <span class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Registros</span>
                    <span class="text-2xl lg:text-3xl font-bold text-slate-800 dark:text-white mt-1" id="kpiCount">0</span>
                </div>
            </div>

            <div class="grid grid-cols-1 xl:grid-cols-3 gap-6 lg:gap-8">
                <!-- Formulario -->
                <div class="xl:col-span-1">
                    <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm dark:shadow-none border border-slate-100 dark:border-slate-700 sticky top-4">
                        <div class="flex items-center gap-3 mb-6 border-b border-slate-100 dark:border-slate-700 pb-4">
                            <div class="w-10 h-10 rounded-full bg-indigo-50 dark:bg-indigo-900/30 flex items-center justify-center text-indigo-600 dark:text-indigo-400"><i class="fa-solid fa-receipt text-lg"></i></div>
                            <h3 class="text-lg font-bold text-slate-800 dark:text-white">Nuevo Gasto</h3>
                        </div>
                        
                        <form id="formGasto" onsubmit="event.preventDefault(); guardarGasto();" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-2 ml-1">Concepto</label>
                                <div class="relative">
                                    <i class="fa-solid fa-file-lines input-icon"></i>
                                    <input type="text" id="gastoConcepto" placeholder="Ej. Bombillos" class="custom-input" required>
                                </div>
                            </div>
                            
                            <div>
                                <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-2 ml-1">Categoría</label>
                                <div class="relative">
                                    <i class="fa-solid fa-tag input-icon"></i>
                                    <select id="gastoCategoria" class="custom-input appearance-none cursor-pointer">
                                        <option value="Mantenimiento">Mantenimiento</option>
                                        <option value="Servicios">Servicios Públicos</option>
                                        <option value="Insumos">Insumos / Limpieza</option>
                                        <option value="Nómina">Nómina / Sueldos</option>
                                        <option value="Impuestos">Impuestos</option>
                                        <option value="Otros">Otros</option>
                                    </select>
                                    <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-xs text-slate-400 dark:text-slate-500 pointer-events-none"></i>
                                </div>
                            </div>
                            
                            <div>
                                <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-2 ml-1">Monto ($)</label>
                                <div class="relative">
                                    <i class="fa-solid fa-dollar-sign input-icon text-slate-400"></i>
                                    <input type="number" id="gastoMonto" step="0.01" placeholder="0.00" class="custom-input font-mono font-bold" required>
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-2 ml-1">Fecha</label>
                                <div class="relative">
                                    <i class="fa-regular fa-calendar input-icon"></i>
                                    <input type="date" id="gastoFecha" class="custom-input pl-10">
                                </div>
                            </div>
                            
                            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow-md shadow-indigo-200 dark:shadow-indigo-900/30 transition-all flex justify-center items-center gap-2 mt-2"><i class="fa-solid fa-save"></i> Guardar Gasto</button>
                        </form>
                    </div>
                </div>
                
                <!-- Lista -->
                <div class="xl:col-span-2">
                    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm dark:shadow-none border border-slate-200 dark:border-slate-700 overflow-hidden h-full flex flex-col">
                        <div class="p-4 lg:p-6 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-white dark:bg-slate-800 shrink-0">
                            <h3 class="text-lg font-bold text-slate-800 dark:text-white">Historial de Egresos</h3>
                        </div>
                        <div class="flex-1 overflow-auto p-0">
                            <table class="w-full text-left border-collapse min-w-[600px]">
                                <thead class="bg-slate-50 dark:bg-slate-900/50 text-slate-500 dark:text-slate-400 text-xs uppercase sticky top-0 z-10">
                                    <tr>
                                        <th class="px-6 py-3 font-semibold">Fecha</th>
                                        <th class="px-6 py-3 font-semibold">Concepto</th>
                                        <th class="px-6 py-3 font-semibold">Categoría</th>
                                        <th class="px-6 py-3 text-right font-semibold">Monto</th>
                                        <th class="px-6 py-3 text-right font-semibold">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="listaGastosBody" class="text-sm text-slate-700 dark:text-slate-300 divide-y divide-slate-100 dark:divide-slate-700/50">
                                    <!-- JS Render -->
                                </tbody>
                            </table>
                        </div>
                        
                        <!-- PAGINACIÓN -->
                        <div class="p-4 border-t border-slate-100 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-900/30 flex items-center justify-between">
                            <button id="btnPrev" onclick="changePage('prev')" class="px-3 py-1.5 text-sm font-medium text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded hover:bg-slate-50 dark:hover:bg-slate-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                                <i class="fa-solid fa-chevron-left mr-1"></i> Anterior
                            </button>
                            <span id="pageInfo" class="text-sm font-medium text-slate-500 dark:text-slate-400">Página 1 de 1</span>
                            <button id="btnNext" onclick="changePage('next')" class="px-3 py-1.5 text-sm font-medium text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded hover:bg-slate-50 dark:hover:bg-slate-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                                Siguiente <i class="fa-solid fa-chevron-right ml-1"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Lógica Menú Móvil
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobileMenuOverlay');
            
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        // Inicialización de fechas
        document.addEventListener('DOMContentLoaded', () => {
            const dateInput = document.getElementById('gastoFecha');
            if(dateInput) dateInput.valueAsDate = new Date();

            const fechaDisplay = document.getElementById("fecha-actual");
            if(fechaDisplay) {
                let dateStr = new Date().toLocaleDateString("es-ES", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
                fechaDisplay.textContent = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
            }
        });
    </script>
    
    <script src="../js/auth-manager.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/gastos.js"></script>
</body>
</html>
