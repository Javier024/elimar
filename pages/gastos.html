<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastos | PARQUEADERO ELIMAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .custom-input { background: #fff; border: 1px solid #cbd5e1; color: #334155; transition: all .3s ease; padding: 10px 12px; border-radius: 8px; width: 100%; }
        .custom-input:focus { border-color: #6366f1; outline: 0; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); }
        ::-webkit-scrollbar { width: 6px; height: 6px; } ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-700 antialiased flex h-screen overflow-hidden">

    <!-- MOBILE MENU OVERLAY -->
    <div id="mobileMenuOverlay" onclick="toggleMenu()" class="fixed inset-0 bg-slate-900/50 z-30 hidden lg:hidden backdrop-blur-sm"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-white border-r border-slate-200 transform -translate-x-full lg:translate-x-0 lg:static lg:inset-auto transition-transform duration-300">
        <div class="h-16 flex items-center px-6 border-b border-slate-100">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center mr-3 shadow-lg shadow-indigo-200">
                <i class="fa-solid fa-square-parking text-white text-sm"></i>
            </div>
            <h1 class="text-lg font-bold text-slate-800">ELIMAR<span class="text-indigo-600">Sys</span></h1>
        </div>
        <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
            <a href="../dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors nav-item"><i class="fa-solid fa-chart-pie w-5 text-center"></i> Dashboard</a>
            <a href="clientes.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors nav-item"><i class="fa-solid fa-users w-5 text-center"></i> Clientes</a>
            <a href="puestos.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors nav-item"><i class="fa-solid fa-layer-group w-5 text-center"></i> Puestos</a>
            <a href="caja.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors nav-item"><i class="fa-solid fa-cash-register w-5 text-center"></i> Caja</a>
            
            <!-- Gastos Active -->
            <a href="gastos.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium bg-indigo-50 text-indigo-700 shadow-sm ring-1 ring-indigo-100 nav-item"><i class="fa-solid fa-receipt w-5 text-center"></i> Gastos</a>
            
            <a href="historial.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors nav-item"><i class="fa-solid fa-clock-rotate-left w-5 text-center"></i> Historial</a>
            <a href="configuracion.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors nav-item"><i class="fa-solid fa-gear w-5 text-center"></i> Configuración</a>
        </nav>
        <div class="p-4 border-t border-slate-100">
            <div class="flex items-center gap-3 px-2 py-2">
                <div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-xs font-bold text-slate-500">A</div>
                <div class="flex-1 min-w-0"><p class="text-sm font-medium text-slate-900 truncate">Admin User</p><p class="text-xs text-slate-500 truncate">admin@parking.com</p></div>
            </div>
            <button onclick="cerrarSesion()" class="mt-2 w-full flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-sm font-bold text-red-600 hover:bg-red-50 border border-red-100 transition-colors"><i class="fa-solid fa-power-off"></i> Salir</button>
        </div>
    </aside>

    <!-- MAIN CONTENT WRAPPER -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header class="h-16 bg-white/90 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-8 z-20 sticky top-0">
            <div class="flex items-center gap-4">
                <button onclick="toggleMenu()" class="lg:hidden p-2 text-slate-600 hover:bg-slate-100 rounded-lg"><i class="fa-solid fa-bars text-xl"></i></button>
                <h2 class="text-xl font-bold text-slate-800">Control de Gastos</h2>
            </div>
            <div class="flex items-center gap-3"><span class="text-sm font-medium text-slate-500 bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm" id="fecha-actual"></span></div>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
            <!-- KPIs (Cambios a AZUL) -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl border border-slate-100 shadow-sm flex flex-col border-l-4 border-l-indigo-600">
                    <span class="text-xs font-bold text-indigo-600 uppercase tracking-wider">Total Gastado</span>
                    <span class="text-3xl font-bold text-slate-800 mt-1 font-mono" id="kpiTotal">$0.00</span>
                </div>
                <div class="bg-white p-6 rounded-xl border border-slate-100 shadow-sm flex flex-col">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Mayor Gasto</span>
                    <div class="mt-2">
                        <p class="text-sm font-bold text-slate-800 truncate" id="kpiTopConcept">-</p>
                        <p class="text-xs text-slate-500" id="kpiTopAmount">$0.00</p>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl border border-slate-100 shadow-sm flex flex-col">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Registros</span>
                    <span class="text-3xl font-bold text-slate-800 mt-1" id="kpiCount">0</span>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-1">
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 sticky top-0">
                        <div class="flex items-center gap-3 mb-6 border-b border-slate-100 pb-4">
                            <div class="w-10 h-10 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600"><i class="fa-solid fa-receipt text-lg"></i></div>
                            <h3 class="text-lg font-bold text-slate-800">Nuevo Gasto</h3>
                        </div>
                        
                        <!-- Formulario -->
                        <form id="formGasto" onsubmit="event.preventDefault(); guardarGasto();" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Concepto</label>
                                <input type="text" id="gastoConcepto" placeholder="Ej. Bombillos" class="custom-input text-sm" required>
                            </div>
                            
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Categoría</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400"><i class="fa-solid fa-tag"></i></span>
                                    <select id="gastoCategoria" class="custom-input pl-10 pr-4 py-2.5 rounded-lg text-sm appearance-none bg-white">
                                        <option value="Mantenimiento">Mantenimiento</option>
                                        <option value="Servicios">Servicios Públicos</option>
                                        <option value="Insumos">Insumos / Limpieza</option>
                                        <option value="Nómina">Nómina / Sueldos</option>
                                        <option value="Impuestos">Impuestos</option>
                                        <option value="Otros">Otros</option>
                                    </select>
                                    <span class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 pointer-events-none"><i class="fa-solid fa-chevron-down text-xs"></i></span>
                                </div>
                            </div>
                            
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Monto ($)</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 font-bold">$</span>
                                    <input type="number" id="gastoMonto" step="0.01" placeholder="0.00" class="custom-input pl-8 pr-4 py-2.5 rounded-lg text-sm font-mono font-bold" required>
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Fecha</label>
                                <input type="date" id="gastoFecha" class="custom-input">
                            </div>
                            
                            <!-- BOTÓN AZUL -->
                            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-all flex justify-center items-center gap-2"><i class="fa-solid fa-save"></i> Guardar</button>
                        </form>
                    </div>
                </div>
                
                <div class="lg:col-span-2">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden h-full flex flex-col">
                        <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                            <h3 class="text-lg font-bold text-slate-800">Historial de Egresos</h3>
                        </div>
                        <div class="flex-1 overflow-auto p-0">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-slate-50 text-slate-500 text-xs uppercase sticky top-0 z-10">
                                    <tr>
                                        <th class="px-6 py-3 font-semibold">Fecha</th>
                                        <th class="px-6 py-3 font-semibold">Concepto</th>
                                        <th class="px-6 py-3 font-semibold">Categoría</th>
                                        <th class="px-6 py-3 text-right font-semibold">Monto</th>
                                        <th class="px-6 py-3 text-right font-semibold">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="listaGastosBody" class="text-sm text-slate-700 divide-y divide-slate-100">
                                    <!-- JS Render -->
                                </tbody>
                            </table>
                        </div>
                        
                        <!-- Paginación -->
                        <div class="bg-slate-50 px-6 py-4 border-t border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4">
                            <span class="text-xs text-slate-500" id="paginationInfo">Mostrando 0 a 0 de 0 registros</span>
                            <div class="flex items-center gap-1" id="paginationControls">
                                <!-- Botones generados por JS -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('gastoFecha').valueAsDate = new Date();
        function toggleMenu() { 
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobileMenuOverlay');
            sidebar.classList.toggle('-translate-x-full'); 
            overlay.classList.toggle('hidden'); 
        }
        function cerrarSesion() { 
            if(confirm('Salir?')) window.location.href='../index.html'; 
        }
    </script>
    
    <script src="../js/gastos.js"></script>
</body>
</html>
