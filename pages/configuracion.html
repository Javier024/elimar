<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración | ParkingSys</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .custom-input { background: #ffffff; border: 1px solid #cbd5e1; color: #334155; transition: all 0.2s; padding: 8px 12px; border-radius: 8px; width: 100%; }
        .custom-input:focus { border-color: #6366f1; outline: none; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); }
        .nav-tab { transition: all 0.2s; border-left: 3px solid transparent; }
        .nav-tab:hover { background-color: #f1f5f9; color: #475569; }
        .nav-tab.active { background-color: #eff6ff; color: #2563eb; border-left-color: #2563eb; font-weight: 600; }
        .hidden-tab { display: none; }
        .visible-tab { display: block; animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 20px; }
    </style>
</head>
<body class="text-slate-700 antialiased flex h-screen overflow-hidden">

    <!-- MOBILE MENU OVERLAY -->
    <div id="mobileMenuOverlay" onclick="toggleMenu()" class="fixed inset-0 bg-slate-900/50 z-30 hidden lg:hidden backdrop-blur-sm"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-white border-r border-slate-200 transform -translate-x-full lg:translate-x-0 lg:static lg:inset-auto transition-transform duration-300">
        <div class="h-16 flex items-center px-6 border-b border-slate-100">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center mr-3 shadow-lg shadow-indigo-200"><i class="fa-solid fa-square-parking text-white text-sm"></i></div>
            <h1 class="text-lg font-bold text-slate-800">Parking<span class="text-indigo-600">Sys</span></h1>
        </div>
        <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
            <a href="../dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 nav-item"><i class="fa-solid fa-chart-pie w-5"></i> Dashboard</a>
            <a href="clientes.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 nav-item"><i class="fa-solid fa-users w-5"></i> Clientes</a>
            <a href="puestos.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 nav-item"><i class="fa-solid fa-layer-group w-5"></i> Puestos</a>
            <a href="caja.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 nav-item"><i class="fa-solid fa-cash-register w-5"></i> Caja</a>
            <a href="gastos.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 nav-item"><i class="fa-solid fa-receipt w-5"></i> Gastos</a>
            <a href="historial.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 nav-item"><i class="fa-solid fa-clock-rotate-left w-5"></i> Historial</a>
            
            <!-- CONFIGURACION ACTIVA -->
            <a href="configuracion.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium bg-indigo-50 text-indigo-700 shadow-sm ring-1 ring-indigo-100 nav-item"><i class="fa-solid fa-gear w-5"></i> Configuración</a>
        </nav>
        <div class="p-4 border-t border-slate-100"><button onclick="cerrarSesion()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold text-red-600 hover:bg-red-50 border border-red-100 transition-colors"><i class="fa-solid fa-power-off"></i> Cerrar Sesión</button></div>
    </aside>

    <!-- MAIN CONTENT WRAPPER -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative w-full">
        <header class="h-16 bg-white/90 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-4 lg:px-8 sticky top-0 z-20">
            <div class="flex items-center gap-4">
                <button onclick="toggleMenu()" class="lg:hidden p-2 text-slate-600 hover:bg-slate-100 rounded-lg"><i class="fa-solid fa-bars text-xl"></i></button>
                <h2 class="text-lg lg:text-xl font-bold text-slate-800">Configuración del Sistema</h2>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="guardarTodo()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg text-sm font-semibold shadow-md transition flex items-center gap-2"><i class="fa-solid fa-floppy-disk"></i> Guardar Cambios</button>
                <span id="fecha-actual" class="text-xs lg:text-sm font-medium text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200"></span>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 lg:p-8">
            <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-8">
                <!-- PESTAÑAS LATERALES -->
                <div class="lg:col-span-1 space-y-2">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <button onclick="switchTab('general')" id="tab-general" class="nav-tab active w-full text-left px-4 py-3 flex items-center gap-3 border-l-4"><i class="fa-solid fa-building w-5"></i> <span>General</span></button>
                        <button onclick="switchTab('tarifas')" id="tab-tarifas" class="nav-tab w-full text-left px-4 py-3 flex items-center gap-3 border-l-4"><i class="fa-solid fa-money-bill-wave w-5"></i> <span>Tarifas</span></button>
                        <button onclick="switchTab('perfil')" id="tab-perfil" class="nav-tab w-full text-left px-4 py-3 flex items-center gap-3 border-l-4"><i class="fa-solid fa-user-shield w-5"></i> <span>Perfil Admin</span></button>
                    </div>
                </div>

                <!-- CONTENIDO DE LAS PESTAÑAS -->
                <div class="lg:col-span-3">
                    <!-- TAB: GENERAL -->
                    <div id="content-general" class="visible-tab bg-white rounded-xl shadow-sm border border-slate-200 p-8">
                        <h3 class="text-lg font-bold text-slate-800 mb-6 pb-2 border-b border-slate-100">Información del Negocio</h3>
                        <form class="space-y-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nombre</label><input type="text" value="PARKING SYS" class="custom-input text-sm font-semibold"></div>
                                <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">NIT</label><input type="text" value="900.123.456-7" class="custom-input text-sm font-mono"></div>
                            </div>
                            <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">Dirección</label><input type="text" value="Calle 123 #45-67" class="custom-input text-sm"></div>
                        </form>
                    </div>

                    <!-- TAB: TARIFAS -->
                    <div id="content-tarifas" class="hidden-tab bg-white rounded-xl shadow-sm border border-slate-200 p-8">
                        <h3 class="text-lg font-bold text-slate-800 mb-6 pb-2 border-b border-slate-100">Tabla de Tarifas</h3>
                        <div class="space-y-6">
                            <div class="border border-slate-200 rounded-lg p-4 bg-slate-50/50">
                                <div class="flex items-center gap-3 mb-4">
                                    <div class="w-8 h-8 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center"><i class="fa-solid fa-car-side"></i></div>
                                    <h4 class="font-bold text-slate-700">Automóvil / Camioneta</h4>
                                </div>
                                <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                                    <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Hora</label><input type="number" value="5000" class="custom-input text-xs font-mono font-bold"></div>
                                    <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Noche</label><input type="number" value="12000" class="custom-input text-xs font-mono font-bold"></div>
                                    <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Semana</label><input type="number" value="40000" class="custom-input text-xs font-mono font-bold"></div>
                                </div>
                            </div>
                             <div class="border border-slate-200 rounded-lg p-4 bg-slate-50/50">
                                <div class="flex items-center gap-3 mb-4">
                                    <div class="w-8 h-8 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center"><i class="fa-solid fa-motorcycle"></i></div>
                                    <h4 class="font-bold text-slate-700">Motocicleta</h4>
                                </div>
                                <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                                    <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Hora</label><input type="number" value="2500" class="custom-input text-xs font-mono font-bold"></div>
                                    <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Noche</label><input type="number" value="6000" class="custom-input text-xs font-mono font-bold"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- TAB: PERFIL -->
                    <div id="content-perfil" class="hidden-tab bg-white rounded-xl shadow-sm border border-slate-200 p-8">
                        <h3 class="text-lg font-bold text-slate-800 mb-6 pb-2 border-b border-slate-100">Perfil del Administrador</h3>
                        <div class="flex flex-col md:flex-row gap-8 items-start">
                            <div class="w-24 h-24 rounded-full bg-slate-200 overflow-hidden border-2 border-slate-300 flex-shrink-0">
                                <img src="https://ui-avatars.com/api/?name=Admin&background=0D8ABC&color=fff" alt="Avatar" class="w-full h-full object-cover">
                            </div>
                            <div class="flex-1 w-full space-y-4">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nombre</label><input type="text" value="Administrador" class="custom-input text-sm"></div>
                                    <div><label class="block text-xs font-bold text-slate-500 uppercase mb-1">Email</label><input type="email" value="admin@parking.com" class="custom-input text-sm"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Lógica de Pestañas
        function switchTab(tabName) {
            // Ocultar todos los contenidos
            document.querySelectorAll('[id^="content-"]').forEach(el => {
                el.classList.remove('visible-tab');
                el.classList.add('hidden-tab');
            });
            // Desactivar botones
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
            
            // Mostrar seleccionado
            document.getElementById('content-' + tabName).classList.remove('hidden-tab');
            document.getElementById('content-' + tabName).classList.add('visible-tab');
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        // Utilidades Generales
        document.getElementById('fecha-actual').innerText = new Date().toLocaleDateString('es-ES');
        function toggleMenu() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('mobileMenuOverlay').classList.toggle('hidden'); }
        function cerrarSesion() { if(confirm('Salir?')) window.location.href='../index.html'; }
        function guardarTodo() { alert('Configuración guardada correctamente.'); }
    </script>
</body>
</html>
