<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración | ParkingSys</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .custom-input { background: #ffffff; border: 1px solid #cbd5e1; color: #334155; transition: all 0.2s; padding: 8px 12px; border-radius: 8px; width: 100%; }
        .custom-input:focus { border-color: #6366f1; outline: none; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); }
        
        /* Tabs Animation */
        .nav-tab { transition: all 0.2s; border-left: 3px solid transparent; }
        .nav-tab:hover { background-color: #f1f5f9; color: #475569; }
        .nav-tab.active { background-color: #eff6ff; color: #2563eb; border-left-color: #2563eb; font-weight: 600; }
        .hidden-tab { display: none; }
        .visible-tab { display: block; animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 20px; }
    </style>
</head>
<body class="text-slate-700 antialiased flex h-screen overflow-hidden">

    <!-- SIDEBAR UNIFICADO -->
    <aside class="hidden lg:flex w-64 bg-white border-r border-slate-200 flex-col shadow-sm z-20">
        <div class="h-16 flex items-center px-6 border-b border-slate-100">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center mr-3 shadow-lg shadow-indigo-200">
                <i class="fa-solid fa-square-parking text-white text-sm"></i>
            </div>
            <h1 class="text-lg font-bold text-slate-800">Parking<span class="text-indigo-600">Sys</span></h1>
        </div>
        <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
            <a href="/dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50"><i class="fa-solid fa-chart-pie w-5"></i> Dashboard</a>
            <a href="/pages/clientes.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50"><i class="fa-solid fa-users w-5"></i> Clientes</a>
            <a href="/pages/puestos.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50"><i class="fa-solid fa-layer-group w-5"></i> Puestos</a>
            <a href="/pages/caja.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50"><i class="fa-solid fa-cash-register w-5"></i> Caja</a>
            <a href="/pages/gastos.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50"><i class="fa-solid fa-receipt w-5"></i> Gastos</a>
            <a href="/pages/historial.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50"><i class="fa-solid fa-clock-rotate-left w-5"></i> Historial</a>
            
            <!-- ACTIVO -->
            <a href="/pages/configuracion.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium bg-indigo-50 text-indigo-700 shadow-sm ring-1 ring-indigo-100">
                <i class="fa-solid fa-gear w-5"></i> Configuración
            </a>
        </nav>
        <div class="p-4 border-t border-slate-100">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-xs font-bold">A</div>
                <div class="text-xs"><p class="font-bold">Admin</p></div>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative w-full">
        
        <!-- HEADER -->
        <header class="h-16 bg-white/90 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-4 lg:px-8 sticky top-0 z-10">
            <div class="flex items-center gap-4">
                <button onclick="toggleMenu()" class="lg:hidden p-2 text-slate-600 hover:bg-slate-100 rounded-lg"><i class="fa-solid fa-bars text-xl"></i></button>
                <h2 class="text-lg lg:text-xl font-bold text-slate-800">Configuración del Sistema</h2>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="guardarTodo()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg text-sm font-semibold shadow-md transition flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> Guardar Cambios
                </button>
                <span id="fecha-actual" class="text-xs lg:text-sm font-medium text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200"></span>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 lg:p-8 custom-scroll">
            <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-8">
                
                <!-- BARRA LATERAL DE PESTAÑAS -->
                <div class="lg:col-span-1 space-y-2">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <button onclick="switchTab('general')" id="tab-general" class="nav-tab active w-full text-left px-4 py-3 flex items-center gap-3 border-l-4">
                            <i class="fa-solid fa-building w-5"></i> <span>General</span>
                        </button>
                        <button onclick="switchTab('tarifas')" id="tab-tarifas" class="nav-tab w-full text-left px-4 py-3 flex items-center gap-3 border-l-4">
                            <i class="fa-solid fa-money-bill-wave w-5"></i> <span>Tarifas</span>
                        </button>
                        <button onclick="switchTab('perfil')" id="tab-perfil" class="nav-tab w-full text-left px-4 py-3 flex items-center gap-3 border-l-4">
                            <i class="fa-solid fa-user-shield w-5"></i> <span>Perfil Admin</span>
                        </button>
                    </div>
                    
                    <div class="bg-indigo-600 rounded-xl p-6 text-white shadow-lg shadow-indigo-500/30 text-center">
                        <p class="text-indigo-100 text-xs font-bold uppercase mb-2">Versión</p>
                        <h3 class="text-3xl font-bold">v2.1</h3>
                        <p class="text-indigo-100 text-xs mt-2">Configuración en DB</p>
                    </div>
                </div>

                <!-- CONTENIDO -->
                <div class="lg:col-span-3">
                    
                    <!-- TAB: GENERAL -->
                    <div id="content-general" class="visible-tab bg-white rounded-xl shadow-sm border border-slate-200 p-8">
                        <h3 class="text-lg font-bold text-slate-800 mb-6 pb-2 border-b border-slate-100">Información del Negocio</h3>
                        <form class="space-y-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nombre</label>
                                    <input type="text" id="confNombre" value="PARKING SYS" class="custom-input text-sm font-semibold">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">NIT</label>
                                    <input type="text" id="confNit" value="900.123.456-7" class="custom-input text-sm font-mono">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Dirección</label>
                                <input type="text" id="confDireccion" value="Calle 123" class="custom-input text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Teléfono</label>
                                <input type="tel" id="confTelefono" value="+57 300 123 4567" class="custom-input text-sm">
                            </div>
                        </form>
                    </div>

                    <!-- TAB: TARIFAS -->
                    <div id="content-tarifas" class="hidden-tab bg-white rounded-xl shadow-sm border border-slate-200 p-8">
                        <h3 class="text-lg font-bold text-slate-800 mb-6 pb-2 border-b border-slate-100">Tabla de Tarifas</h3>
                        <div class="space-y-6">
                            <!-- Carro -->
                            <div class="border border-slate-200 rounded-lg p-4 bg-slate-50/50">
                                <div class="flex items-center gap-3 mb-4"><div class="w-8 h-8 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center"><i class="fa-solid fa-car-side"></i></div><h4 class="font-bold text-slate-700">Automóvil / Camioneta</h4></div>
                                <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                                    <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Hora</label><input type="number" id="tarifaCarroHora" value="5000" class="custom-input text-xs font-mono font-bold"></div>
                                    <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Noche</label><input type="number" id="tarifaCarroNoche" value="12000" class="custom-input text-xs font-mono font-bold"></div>
                                    <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Semana</label><input type="number" id="tarifaCarroSemana" value="40000" class="custom-input text-xs font-mono font-bold"></div>
                                    <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Quincena</label><input type="number" id="tarifaCarroQuincenal" value="75000" class="custom-input text-xs font-mono font-bold"></div>
                                    <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Mes</label><input type="number" id="tarifaCarroMensual" value="140000" class="custom-input text-xs font-mono font-bold"></div>
                                </div>
                            </div>
                            <!-- Moto -->
                            <div class="border border-slate-200 rounded-lg p-4 bg-slate-50/50">
                                <div class="flex items-center gap-3 mb-4"><div class="w-8 h-8 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center"><i class="fa-solid fa-motorcycle"></i></div><h4 class="font-bold text-slate-700">Motocicleta</h4></div>
                                <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                                    <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Hora</label><input type="number" id="tarifaMotoHora" value="2500" class="custom-input text-xs font-mono font-bold"></div>
                                    <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Noche</label><input type="number" id="tarifaMotoNoche" value="6000" class="custom-input text-xs font-mono font-bold"></div>
                                    <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Semana</label><input type="number" id="tarifaMotoSemana" value="20000" class="custom-input text-xs font-mono font-bold"></div>
                                    <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Quincena</label><input type="number" id="tarifaMotoQuincenal" value="35000" class="custom-input text-xs font-mono font-bold"></div>
                                    <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Mes</label><input type="number" id="tarifaMotoMensual" value="65000" class="custom-input text-xs font-mono font-bold"></div>
                                </div>
                            </div>
                            <!-- Bici -->
                            <div class="border border-slate-200 rounded-lg p-4 bg-slate-50/50">
                                <div class="flex items-center gap-3 mb-4"><div class="w-8 h-8 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center"><i class="fa-solid fa-bicycle"></i></div><h4 class="font-bold text-slate-700">Bicicleta</h4></div>
                                <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                                    <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Hora</label><input type="number" id="tarifaBiciHora" value="1000" class="custom-input text-xs font-mono font-bold"></div>
                                    <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Noche</label><input type="number" id="tarifaBiciNoche" value="2000" class="custom-input text-xs font-mono font-bold"></div>
                                    <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Semana</label><input type="number" id="tarifaBiciSemana" value="8000" class="custom-input text-xs font-mono font-bold"></div>
                                    <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Quincena</label><input type="number" id="tarifaBiciQuincenal" value="15000" class="custom-input text-xs font-mono font-bold"></div>
                                    <div><label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Mes</label><input type="number" id="tarifaBiciMensual" value="25000" class="custom-input text-xs font-mono font-bold"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- TAB: PERFIL -->
                    <div id="content-perfil" class="hidden-tab bg-white rounded-xl shadow-sm border border-slate-200 p-8">
                        <h3 class="text-lg font-bold text-slate-800 mb-6 pb-2 border-b border-slate-100">Perfil del Administrador</h3>
                        <div class="flex flex-col md:flex-row gap-8 items-start">
                            <div class="relative">
                                <div class="w-24 h-24 rounded-full bg-slate-200 overflow-hidden border-2 border-slate-300">
                                    <img src="https://ui-avatars.com/api/?name=Admin&background=0D8ABC&color=fff" alt="Avatar" class="w-full h-full object-cover">
                                </div>
                            </div>
                            <div class="flex-1 w-full space-y-4">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nombre</label>
                                        <input type="text" id="perfNombre" value="Administrador" class="custom-input text-sm">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Email</label>
                                        <input type="email" id="perfEmail" value="admin@parking.com" class="custom-input text-sm">
                                    </div>
                                </div>
                                <div class="flex items-center gap-2 pt-2">
                                    <input type="checkbox" id="perfNotif" class="w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500">
                                    <label for="perfNotif" class="text-sm text-slate-600">Recibir notificaciones</label>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- MENÚ MÓVIL -->
    <div id="mobileMenu" class="fixed inset-0 bg-slate-900/50 z-40 hidden lg:hidden backdrop-blur-sm">
        <div class="bg-white w-64 h-full shadow-xl flex flex-col p-4">
            <div class="flex items-center justify-between mb-8"><h1 class="text-lg font-bold text-slate-800">Menú</h1><button onclick="toggleMenu()" class="text-slate-500"><i class="fa-solid fa-xmark text-xl"></i></button></div>
            <nav class="space-y-2">
                <a href="/pages/configuracion.html" class="block px-4 py-3 rounded-lg bg-indigo-50 text-indigo-700 font-bold"><i class="fa-solid fa-gear w-6"></i> Configuración</a>
            </nav>
        </div>
    </div>

    <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-3"></div>
    <script src="/js/configuracion.js"></script>
</body>
</html>
